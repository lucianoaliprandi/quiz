<title>Revisão ENADE em Slides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f5f0;
    --surface:#ffffff;
    --ink:#201c17;
    --ink-muted:#736b5c;
    --rule:#e4ddce;
    --accent:#2f5233;
    --accent-ink:#1e3722;
    --accent-soft:#e4ede1;
    --gold:#a9822c;
    --correct:#2f6b3f;
    --correct-soft:#e2efe4;
    --correct-ink:#1c4326;
    --wrong:#a3432f;
    --wrong-soft:#f6e6e0;
    --wrong-ink:#7a2f1f;
    --shadow: 0 1px 2px rgba(32,28,23,.05), 0 16px 32px -18px rgba(32,28,23,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#18160f;
      --surface:#231f18;
      --ink:#f1ebdd;
      --ink-muted:#b0a68f;
      --rule:#3a3427;
      --accent:#8fbb8f;
      --accent-ink:#dcecdc;
      --accent-soft:#293427;
      --gold:#dcb766;
      --correct:#7fc08f;
      --correct-soft:#233026;
      --correct-ink:#bfe6c8;
      --wrong:#e08a6d;
      --wrong-soft:#332420;
      --wrong-ink:#f0b8a2;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 18px 36px -18px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#18160f;
    --surface:#231f18;
    --ink:#f1ebdd;
    --ink-muted:#b0a68f;
    --rule:#3a3427;
    --accent:#8fbb8f;
    --accent-ink:#dcecdc;
    --accent-soft:#293427;
    --gold:#dcb766;
    --correct:#7fc08f;
    --correct-soft:#233026;
    --correct-ink:#bfe6c8;
    --wrong:#e08a6d;
    --wrong-soft:#332420;
    --wrong-ink:#f0b8a2;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 18px 36px -18px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    line-height:1.5;
    overflow:hidden;
  }
  h1,h2,h3{
    font-family:"Source Serif 4", Georgia, serif;
    text-wrap:balance;
    font-weight:600;
    margin:0;
  }
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace;}

  /* ---------------- app shell ---------------- */
  #app{
    height:100dvh;
    display:flex;
    flex-direction:column;
  }

  /* progress */
  .progress-track{
    height:3px;
    background:var(--rule);
    flex-shrink:0;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width .25s ease;
  }

  /* top bar */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:12px 20px;
    border-bottom:1px solid var(--rule);
    flex-shrink:0;
    flex-wrap:wrap;
  }
  .topbar .brand{
    font-family:"Source Serif 4", serif;
    font-weight:600;
    font-size:15px;
    white-space:nowrap;
  }
  .topbar .crumb{
    font-size:12px;
    color:var(--ink-muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .topbar .right{
    display:flex;
    align-items:center;
    gap:10px;
  }
  select#jump{
    font-family:"IBM Plex Mono", monospace;
    font-size:11.5px;
    background:var(--surface);
    color:var(--ink);
    border:1px solid var(--rule);
    border-radius:6px;
    padding:5px 8px;
    max-width:38vw;
  }
  .counter{
    font-family:"IBM Plex Mono", monospace;
    font-size:11.5px;
    color:var(--ink-muted);
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }

  /* stage */
  .stage{
    flex:1;
    overflow:hidden;
    position:relative;
  }
  .slide{
    position:absolute;
    inset:0;
    display:none;
    overflow-y:auto;
    padding:36px 20px 32px;
  }
  .slide.active{display:flex;}
  .slide-inner{
    max-width:760px;
    margin:0 auto;
    width:100%;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  /* ---------------- title / section / end slides ---------------- */
  .slide.center .slide-inner{
    margin:auto;
    text-align:center;
    align-items:center;
  }
  .kicker{
    font-family:"IBM Plex Mono", monospace;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--gold);
  }
  .title-big{font-size:clamp(28px,5vw,42px); line-height:1.12;}
  .title-sub{color:var(--ink-muted); font-size:15.5px; max-width:56ch;}
  .stat-row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:8px;}
  .stat{
    background:var(--surface); border:1px solid var(--rule); border-radius:8px;
    padding:10px 16px; min-width:100px;
  }
  .stat b{display:block; font-family:"IBM Plex Mono",monospace; font-size:19px;}
  .stat span{font-size:11px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.04em;}
  .hint{font-size:12.5px; color:var(--ink-muted); margin-top:18px;}

  .section-num{
    font-family:"IBM Plex Mono", monospace;
    font-size:56px;
    color:var(--accent-soft);
    -webkit-text-stroke:1.5px var(--accent);
    line-height:1;
  }
  .section-desc{color:var(--ink-muted); font-size:15px; max-width:58ch;}
  .section-count{
    font-family:"IBM Plex Mono", monospace;
    font-size:12px; color:var(--gold); text-transform:uppercase; letter-spacing:.06em;
  }

  /* ---------------- question / answer slides ---------------- */
  .tag-row{
    display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center;
    font-family:"IBM Plex Mono", monospace; font-size:11.5px;
    color:var(--gold); text-transform:uppercase; letter-spacing:.04em;
  }
  .tag-row .qnum{
    color:var(--ink); background:var(--accent-soft); padding:2px 9px; border-radius:4px;
    text-transform:none; letter-spacing:0; font-size:12px;
  }
  .tag-row .sep{color:var(--rule);}
  .kind-label{
    font-family:"IBM Plex Mono", monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-muted);
  }

  .stem p{margin:0 0 10px; font-size:15.5px;}
  .stem p:last-child{margin-bottom:0;}
  .stem .roman{padding-left:1.4em; text-indent:-1.4em; font-size:14.5px;}
  .stem .cite{color:var(--ink-muted); font-size:12.5px; font-style:normal;}
  .chart-img{display:block; max-width:100%; height:auto; background:#fff; border:1px solid var(--rule); border-radius:8px; padding:10px; margin:4px 0 10px;}
  .stem code.block{
    display:block; font-family:"IBM Plex Mono",monospace; font-size:12.5px;
    background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:10px 12px; white-space:pre-wrap;
  }

  ol.opts{list-style:none; margin:4px 0 0; padding:0; display:flex; flex-direction:column; gap:8px;}
  ol.opts li{
    display:grid; grid-template-columns:1.7em 1fr; gap:9px; font-size:14.5px;
    background:var(--surface); border:1px solid var(--rule); border-radius:8px; padding:10px 12px;
  }
  ol.opts li .letter{font-family:"IBM Plex Mono",monospace; font-weight:600; color:var(--ink-muted);}

  .answer-banner{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    background:var(--correct-soft); border:1px solid var(--correct); border-radius:10px;
    padding:14px 18px;
  }
  .answer-banner .big-letter{
    font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:26px; color:var(--correct-ink);
    background:var(--surface); border:1px solid var(--correct); border-radius:8px;
    width:44px; height:44px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .answer-banner .txt b{display:block; font-size:14.5px; color:var(--correct-ink); font-family:"Source Serif 4",serif;}
  .answer-banner .txt span{font-size:12.5px; color:var(--ink-muted);}

  .breakdown{display:flex; flex-direction:column; gap:8px;}
  .alt{
    display:grid; grid-template-columns:2.4em 1fr; gap:10px;
    border:1px solid var(--rule); border-radius:8px; padding:10px 12px; background:var(--surface);
  }
  .alt.correct{border-color:var(--correct); background:var(--correct-soft);}
  .alt.wrong{border-color:var(--rule);}
  .alt .badge-col{display:flex; flex-direction:column; align-items:center; gap:4px;}
  .alt .letter{font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:15px;}
  .alt .verdict{
    font-family:"IBM Plex Mono",monospace; font-size:9px; text-transform:uppercase; letter-spacing:.03em;
    padding:2px 5px; border-radius:3px; white-space:nowrap;
  }
  .alt.correct .verdict{background:var(--correct); color:var(--surface);}
  .alt.wrong .verdict{background:var(--wrong-soft); color:var(--wrong-ink);}
  .alt p{margin:0; font-size:13.5px;}

  .tip-box{
    display:flex; gap:12px; align-items:flex-start;
    background:var(--gold-soft, transparent); background:color-mix(in srgb, var(--gold) 12%, var(--surface));
    border:1px solid var(--gold); border-radius:10px; padding:14px 16px;
  }
  .tip-box .tip-icon{
    font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:11px; color:var(--gold);
    text-transform:uppercase; letter-spacing:.05em; flex-shrink:0; padding-top:2px;
  }
  .tip-box p{margin:0; font-size:13.5px; color:var(--ink);}

  .criteria-list{
    display:flex; flex-direction:column; gap:8px; margin:0; padding:0; list-style:none;
  }
  .criteria-list li{
    background:var(--surface); border:1px solid var(--rule); border-left:4px solid var(--gold);
    border-radius:6px; padding:10px 14px; font-size:14px;
  }

  /* ---------------- bottom nav ---------------- */
  .navbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 20px; border-top:1px solid var(--rule); flex-shrink:0;
  }
  .navbtn{
    font-family:"IBM Plex Mono",monospace; font-size:12.5px; text-transform:uppercase; letter-spacing:.04em;
    background:var(--surface); color:var(--ink); border:1px solid var(--rule); border-radius:7px;
    padding:9px 16px; cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .navbtn:hover:not(:disabled){border-color:var(--accent);}
  .navbtn:disabled{opacity:.35; cursor:default;}
  .navbtn.primary{background:var(--accent); border-color:var(--accent); color:var(--surface);}
  .navbtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .navbar .mid{
    font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-muted);
    display:none;
  }
  @media (min-width:560px){ .navbar .mid{display:block;} }

  @media (max-width:480px){
    .topbar{padding:10px 14px;}
    .slide{padding:24px 14px 24px;}
    .navbar{padding:10px 14px;}
    select#jump{max-width:50vw;}
  }
</style>

<div id="app">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="topbar">
    <div class="brand">Revisão ENADE</div>
    <div class="crumb" id="crumb">—</div>
    <div class="right">
      <select id="jump" aria-label="Ir para"></select>
      <span class="counter" id="counter">1 / 1</span>
    </div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="navbar">
    <button class="navbtn" id="prevBtn">&larr; Anterior</button>
    <span class="mid" id="midLabel"></span>
    <button class="navbtn primary" id="nextBtn">Próxima &rarr;</button>
  </div>
</div>

<script>
/* ============ DATA ============ */
const sections = [
  {
    key:"dist", n:"01", name:"Sistemas Distribuídos &amp; Nuvem",
    desc:"Conceitos fundamentais de sistemas distribuídos, arquitetura de microsserviços e modelos de serviço/implantação em nuvem.",
    questions:[
      {
        tag:"Q35 · Ciência da Computação (Bacharelado) · ENADE 2021",
        stem:[
          {p:"Um sistema distribuído é aquele no qual os componentes de hardware ou software, localizados em computadores interligados em rede, comunicam-se e coordenam suas ações apenas enviando mensagens entre si."},
          {cite:"COULOURIS, G. et al. Sistemas distribuídos: conceitos e projeto. 5. ed., Porto Alegre: Bookman, 2013 (adaptado)."},
          {p:"Com base na definição apresentada e nos conceitos básicos de sistemas distribuídos, assinale a opção correta."}
        ],
        options:[
          {l:"A",t:"A existência de um relógio físico local sincronizado com um relógio global é o que permite aos usuários de um sistema distribuído trocarem mensagens de forma coordenada."},
          {l:"B",t:"A falha de um componente em um sistema distribuído peer-to-peer causa a interrupção de todos os demais componentes até o seu retorno."},
          {l:"C",t:"O compartilhamento dos recursos distribuídos entre computadores interligados por uma rede é possível desde que os dispositivos sejam homogêneos em termos de hardware e software."},
          {l:"D",t:"A adição de novos dispositivos em um sistema distribuído para atender a uma demanda temporária ou crescente está ligada à característica de escalabilidade do sistema."},
          {l:"E",t:"A possibilidade de vários clientes acessarem de forma concorrente um mesmo recurso compartilhado em um servidor é resultado do alto nível de transparência do sistema."}
        ],
        correct:"D",
        breakdown:[
          {l:"A",v:"wrong",t:"Sistemas distribuídos não possuem um relógio global confiável — a ausência de tempo global simultâneo é justamente um dos grandes desafios da área; a coordenação ocorre por troca de mensagens, não por sincronismo de relógio."},
          {l:"B",v:"wrong",t:"É o oposto: arquiteturas P2P são projetadas para tolerar a falha de nós individuais sem derrubar o sistema inteiro — não há ponto único de falha."},
          {l:"C",v:"wrong",t:"Heterogeneidade de hardware e software é normal e esperada em sistemas distribuídos; a transparência é o mecanismo que mascara essas diferenças do usuário, e não um requisito de homogeneidade."},
          {l:"D",v:"correct",t:"Escalabilidade é exatamente a capacidade de crescer — adicionar nós ou recursos — para atender a uma demanda que aumenta, temporária ou permanentemente."},
          {l:"E",v:"wrong",t:"Acesso concorrente é viabilizado por mecanismos de controle de concorrência/sincronização; a transparência esconde a distribuição do sistema do usuário, mas não é, em si, a causa do acesso concorrente."}
        ],
        tip:"Memorize os tipos de transparência (acesso, localização, concorrência, replicação, falha, mobilidade, desempenho, escala) e os três desafios centrais — falta de relógio global, falhas parciais e heterogeneidade. A maioria das questões conceituais de sistemas distribuídos gira em torno desses pontos."
      },
      {
        tag:"Q38 · Engenharia de Computação · ENADE 2023",
        stem:[
          {p:"Os sistemas distribuídos consistem em múltiplos componentes de software que se comunicam e que cooperam entre si para realizar tarefas complexas. Um padrão arquitetural comumente utilizado é o de microsserviços, que divide o sistema em componentes independentes e escaláveis, cada um executando sua própria funcionalidade específica."},
          {p:"Qual dos seguintes benefícios é associado à arquitetura de microsserviços em sistemas distribuídos?"}
        ],
        options:[
          {l:"A",t:"Capacidade de escalabilidade."},
          {l:"B",t:"Garantia de consistência de dados."},
          {l:"C",t:"Melhor desempenho de processamento."},
          {l:"D",t:"Menor consumo de recursos de hardware."},
          {l:"E",t:"Redução da complexidade de comunicação entre os componentes."}
        ],
        correct:"A",
        breakdown:[
          {l:"A",v:"correct",t:"Escalar cada serviço de forma independente, conforme sua própria demanda, é o benefício clássico e mais citado da arquitetura de microsserviços."},
          {l:"B",v:"wrong",t:"Consistência de dados é justamente um desafio em microsserviços: cada serviço tende a ter seu próprio banco, exigindo padrões extras (sagas, eventos) para manter os dados coerentes."},
          {l:"C",v:"wrong",t:"Não há garantia de melhor desempenho — a comunicação em rede entre serviços introduz latência que não existe em um monolito."},
          {l:"D",v:"wrong",t:"Ao contrário: múltiplos serviços independentes, com suas réplicas e containers, costumam consumir mais recursos do que uma aplicação monolítica equivalente."},
          {l:"E",v:"wrong",t:"A complexidade de comunicação aumenta, não diminui — cada interação passa a depender de rede, contratos de API e tolerância a falhas de rede."}
        ],
        tip:"Separe mentalmente 'benefícios' de 'custos' dos microsserviços: benefícios = escalabilidade independente, deploys independentes, isolamento de falhas; custos = maior complexidade de comunicação, consistência de dados distribuída, overhead operacional."
      },
      {
        tag:"Q20 · Engenharia de Computação · ENADE 2023",
        stem:[
          {p:"Computação em nuvem representa um conceito relativo ao compartilhamento de recursos, tais como capacidade de processamento, armazenamento e comunicação de dados. Quando esse compartilhamento constitui um serviço disponível para qualquer pessoa, o serviço é conhecido como nuvem pública."},
          {p:"Considerando as vantagens que um gerente espera obter na contratação de um serviço de nuvem pública, avalie as afirmações a seguir."},
          {roman:"I. Um serviço de nuvem pública proporciona a redução de custos operacionais, pois é possível dimensionar a necessidade desses recursos com base na demanda."},
          {roman:"II. Um serviço de nuvem pública gera aumento da velocidade de execução do software a partir de qualquer localidade, pois garante acesso rápido em qualquer parte do mundo."},
          {roman:"III. Um serviço de nuvem pública viabiliza a redução do investimento inicial com equipamentos, infraestrutura e pessoal, pois torna possível adiar essa instalação até que a operação se demonstre economicamente viável."},
          {roman:"IV. Um serviço de nuvem pública propicia aumento de segurança da informação, pois as rotinas de segurança são responsabilidade do administrador da nuvem pública, não do contratante."},
          {p:"É correto apenas o que se afirma em"}
        ],
        options:[
          {l:"A",t:"I e II."},
          {l:"B",t:"I e III."},
          {l:"C",t:"II e IV."},
          {l:"D",t:"I, III e IV."},
          {l:"E",t:"II, III e IV."}
        ],
        correct:"B",
        correctLabel:"I e III",
        statements:[
          {n:"I",v:"correct",t:"Verdadeira: a elasticidade sob demanda permite dimensionar recursos conforme a necessidade real, o que reduz custo operacional em comparação a uma infraestrutura própria dimensionada para o pico."},
          {n:"II",v:"wrong",t:"Falsa: velocidade e latência dependem da localização do data center e da qualidade da rede até ele — a nuvem pública não garante acesso rápido em qualquer parte do mundo."},
          {n:"III",v:"correct",t:"Verdadeira: o modelo de nuvem transforma investimento inicial em equipamentos (CAPEX) em despesa recorrente por uso (OPEX), permitindo adiar esse investimento até a operação se mostrar viável."},
          {n:"IV",v:"wrong",t:"Falsa: a nuvem segue um modelo de responsabilidade compartilhada — o contratante também responde por parte da segurança (dados, configuração, controle de acesso), não apenas o provedor."}
        ],
        tip:"Desconfie de alternativas absolutas sobre nuvem ('garante', 'sempre', 'responsabilidade exclusiva de X') — a segurança na nuvem segue o modelo de responsabilidade compartilhada, e a latência varia conforme a região do data center."
      },
      {
        tag:"Q25 · Ciência da Computação (Bacharelado e Licenciatura) · ENADE 2021",
        stem:[
          {p:"A computação em nuvem pode ser definida como a infraestrutura de comunicação representada por vários servidores web, responsáveis por armazenar dados e aplicações. Segundo o NIST, um modelo de Computação em Nuvem deve apresentar 5 características essenciais, 3 modelos de serviço (SaaS, PaaS, IaaS) e 4 modelos de implantação (Privada, Pública, Comunidade e Híbrida)."},
          {p:"Considerando essas informações, avalie as afirmações a seguir."},
          {roman:"I. No modelo SaaS, o usuário não precisa adquirir ou realizar upgrade de hardware, não administra a infraestrutura subjacente, e as atualizações de software são de responsabilidade do provedor."},
          {roman:"II. A elasticidade é a capacidade de aumentar ou diminuir de forma automática o tempo de disponibilidade dos recursos computacionais provisionados contratualmente para cada usuário."},
          {roman:"III. A Nuvem Comunidade tem como objetivo gerenciar os recursos computacionais pertencentes a cada uma das organizações participantes de uma comunidade, para compartilhar a infraestrutura entre todos."},
          {roman:"IV. No modelo IaaS, o usuário não administra a infraestrutura da nuvem, mas tem controle sobre os sistemas operacionais, armazenamento e aplicativos implantados."},
          {p:"É correto apenas o que se afirma em"}
        ],
        options:[
          {l:"A",t:"I e II."},
          {l:"B",t:"I e IV."},
          {l:"C",t:"II e III."},
          {l:"D",t:"I, III e IV."},
          {l:"E",t:"II, III e IV."}
        ],
        correct:"B",
        correctLabel:"I e IV",
        statements:[
          {n:"I",v:"correct",t:"Verdadeira: no SaaS, o provedor cuida de tudo — o usuário não precisa investir em hardware nem administrar a infraestrutura, e recebe as atualizações de software automaticamente."},
          {n:"II",v:"wrong",t:"Falsa: elasticidade é a capacidade de escalar automaticamente a quantidade de recursos conforme a demanda (mais ou menos CPU, armazenamento etc.) — não o 'tempo de disponibilidade' dos recursos contratados."},
          {n:"III",v:"wrong",t:"Falsa: a definição do NIST para Nuvem Comunidade é uma infraestrutura compartilhada por organizações com interesses em comum, e não 'gerenciada por cada organização' individualmente."},
          {n:"IV",v:"correct",t:"Verdadeira: no IaaS o usuário controla sistemas operacionais, armazenamento e aplicativos implantados, mas não administra a infraestrutura de virtualização subjacente, que é do provedor."}
        ],

      {

/* ============ BUILD FLAT SLIDE LIST ============ */
const slides = [];
slides.push({type:"title"});
sections.forEach(sec=>{
  slides.push({type:"section", sec});
  sec.questions.forEach((q,qi)=>{
    slides.push({type:"question", sec, q, qi});
    slides.push({type:"answer", sec, q, qi});
  });
});
slides.push({type:"end"});

/* ============ RENDER HELPERS ============ */
function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function renderStem(stem){
  return stem.map(seg=>{
    if(seg.p) return `<p>${seg.p}</p>`;
    if(seg.roman) return `<p class="roman">${seg.roman}</p>`;
    if(seg.cite) return `<p class="cite">${seg.cite}</p>`;
    if(seg.code) return `<code class="block">${escapeHtml(seg.code)}</code>`;
    if(seg.img) return `<img class="chart-img" src="${seg.img}" alt="${seg.alt||""}">`;
    return "";
  }).join("");
}
function renderOptions(options){
  return `<ol class="opts">${options.map(o=>`<li><span class="letter">${o.l}</span><span>${o.t}</span></li>`).join("")}</ol>`;
}
function renderBreakdown(breakdown){
  return `<div class="breakdown">${breakdown.map(b=>`
    <div class="alt ${b.v}">
      <div class="badge-col"><span class="letter">${b.l}</span><span class="verdict">${b.v==='correct'?'Correta':'Incorreta'}</span></div>
      <p>${b.t}</p>
    </div>`).join("")}</div>`;
}
function renderStatements(statements){
  return `<div class="breakdown">${statements.map(s=>`
    <div class="alt ${s.v}">
      <div class="badge-col"><span class="letter">${s.n}</span><span class="verdict">${s.v==='correct'?'Verdadeira':'Falsa'}</span></div>
      <p>${s.t}</p>
    </div>`).join("")}</div>`;
}

function slideHTML(s, idx){
  if(s.type==="title"){
    const total = sections.reduce((a,sec)=>a+sec.questions.length,0);
    return `<div class="slide-inner">
      <div class="kicker">ENADE 2021 &amp; 2023 · Área de Computação</div>
      <h1 class="title-big">Revisão em Slides: Dados e Sistemas</h1>
      <p class="title-sub">Para cada questão: um slide com o enunciado, seguido de um slide com a resposta certa, por que cada alternativa errada falha, e uma dica de como acertar questões parecidas.</p>
      <div class="stat-row">
        <div class="stat"><b>${total}</b><span>questões</span></div>
        <div class="stat"><b>3</b><span>eixos</span></div>
        <div class="stat"><b>${slides.length}</b><span>slides</span></div>
      </div>
      <p class="hint">Use as setas do teclado (&larr; &rarr;) ou os botões abaixo para navegar.</p>
    </div>`;
  }
  if(s.type==="section"){
    return `<div class="slide-inner">
      <div class="section-num">${s.sec.n}</div>
      <h2 class="title-big" style="font-size:clamp(24px,4vw,32px)">${s.sec.name}</h2>
      <p class="section-desc">${s.sec.desc}</p>
      <div class="section-count">${s.sec.questions.length} ${s.sec.questions.length>1?"questões":"questão"}</div>
    </div>`;
  }
  if(s.type==="question"){
    return `<div class="slide-inner">
      <div class="tag-row"><span class="kind-label">Questão</span><span class="sep">·</span><span class="qnum">${s.q.tag}</span></div>
      <div class="stem">${renderStem(s.q.stem)}</div>
      ${s.q.discursive ? `<div class="tip-box"><span class="tip-icon">Discursiva</span><p>Questão sem alternativas — resposta redigida e corrigida por banca a partir de critérios esperados. Veja o próximo slide.</p></div>` : renderOptions(s.q.options)}
    </div>`;
  }
  if(s.type==="answer"){
    if(s.q.discursive){
      return `<div class="slide-inner">
        <div class="tag-row"><span class="kind-label">Gabarito &amp; critérios</span><span class="sep">·</span><span class="qnum">${s.q.tag}</span></div>
        <div class="answer-banner" style="background:var(--gold-soft, var(--accent-soft));">
          <div class="big-letter" style="font-size:13px;">DISC</div>
          <div class="txt"><b>Questão discursiva</b><span>Corrigida por banca — sem gabarito de múltipla escolha (A–E)</span></div>
        </div>
        <ul class="criteria-list">${s.q.criteria.map(c=>`<li>${c}</li>`).join("")}</ul>
        <div class="tip-box"><span class="tip-icon">Dica</span><p>${s.q.tip}</p></div>
      </div>`;
    }
    const isStatements = !!s.q.statements;
    return `<div class="slide-inner">
      <div class="tag-row"><span class="kind-label">Gabarito &amp; explicação</span><span class="sep">·</span><span class="qnum">${s.q.tag}</span></div>
      <div class="answer-banner">
        <div class="big-letter">${s.q.correct}</div>
        <div class="txt"><b>Alternativa correta${s.q.correctLabel ? " — "+s.q.correctLabel : ""}</b><span>${isStatements ? "Veja abaixo se cada afirmação é verdadeira ou falsa" : "Veja abaixo por que cada opção está certa ou errada"}</span></div>
      </div>
      ${isStatements ? renderStatements(s.q.statements) : renderBreakdown(s.q.breakdown)}
      <div class="tip-box"><span class="tip-icon">Dica</span><p>${s.q.tip}</p></div>
    </div>`;
  }
  if(s.type==="end"){
    const total = sections.reduce((a,sec)=>a+sec.questions.length,0);
    return `<div class="slide-inner">
      <div class="kicker">Fim da revisão</div>
      <h1 class="title-big">Bom estudo!</h1>
      <p class="title-sub">Você revisou ${total} questões de ENADE 2021 e 2023 sobre sistemas distribuídos, estatística e big data / ciência de dados.</p>
      <p class="hint">Use o seletor no topo para revisitar qualquer questão diretamente.</p>
    </div>`;
  }
  return "";
}

function crumbFor(s){
  if(s.type==="title") return "Abertura";
  if(s.type==="section") return `Seção ${s.sec.n} · ${s.sec.name.replace(/&amp;/g,"&")}`;
  if(s.type==="end") return "Encerramento";
  const kind = s.type==="question" ? "Enunciado" : "Gabarito";
  return `${s.sec.n} · ${s.sec.name.replace(/&amp;/g,"&")} — ${kind}`;
}

/* ============ MOUNT ============ */
const stage = document.getElementById("stage");
slides.forEach((s,i)=>{
  const div = document.createElement("div");
  div.className = "slide" + (["title","section","end"].includes(s.type) ? " center" : "");
  div.id = "slide-"+i;
  div.innerHTML = slideHTML(s,i);
  stage.appendChild(div);
});

const jump = document.getElementById("jump");
(function buildJump(){
  slides.forEach((s,i)=>{
    if(s.type==="question"){
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = `${s.sec.n}.${s.qi+1} — ${s.q.tag.split(" · ")[0]} (${s.sec.name.replace(/&amp;/g,"&")})`;
      jump.appendChild(opt);
    }
  });
})();

let current = 0;
const els = Array.from(document.querySelectorAll(".slide"));
const progressFill = document.getElementById("progressFill");
const counter = document.getElementById("counter");
const crumb = document.getElementById("crumb");
const midLabel = document.getElementById("midLabel");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

function goTo(i){
  if(i<0 || i>=slides.length) return;
  els[current].classList.remove("active");
  current = i;
  els[current].classList.add("active");
  els[current].scrollTop = 0;
  progressFill.style.width = ((current+1)/slides.length*100)+"%";
  counter.textContent = (current+1)+" / "+slides.length;
  crumb.textContent = crumbFor(slides[current]);
  midLabel.textContent = slides[current].type==="question" ? "Enunciado — próximo slide traz o gabarito" :
                          slides[current].type==="answer" ? "Gabarito comentado" : "";
  prevBtn.disabled = current===0;
  nextBtn.disabled = current===slides.length-1;
  nextBtn.textContent = current===slides.length-1 ? "Fim" : "Próxima →";
  const jv = [...jump.options].reverse().find(o=>Number(o.value)<=current);
  if(jv) jump.value = jv.value;
}

prevBtn.addEventListener("click", ()=>goTo(current-1));
nextBtn.addEventListener("click", ()=>goTo(current+1));
jump.addEventListener("change", ()=>goTo(Number(jump.value)));
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowRight" || e.key===" ") { e.preventDefault(); goTo(current+1); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); goTo(current-1); }
});

goTo(0);
</script>
