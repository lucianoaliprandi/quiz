conexão direta entre elas."},{"text":"I, II, III e IV.","correct":false,"feedback":"III é falsa: a IEC 62443 recomenda a segmentação (com DMZ) entre as redes OT e de TI, e não sua conexão direta, o que contraria diretamente essa afirmação."}]},{"id":24,"tag":"Questão inédita – Redes de Comunicação Industrial","statement":"O modelo de referência ISA-95 (relacionado à pirâmide de automação) organiza as atividades de uma planta industrial em níveis hierárquicos, do chão de fábrica até o planejamento corporativo. Assinale a alternativa que associa corretamente um nível hierárquico típico dessa pirâmide à sua função principal.","image":null,"alts":[{"text":"Nível 0 (processo físico) — corresponde à execução do software ERP, responsável pelo planejamento de recursos da empresa.","correct":false,"feedback":"O nível 0 corresponde ao próprio processo físico da produção (o produto sendo fabricado/transformado), e não à execução do ERP — o ERP está associado ao nível 4, de planejamento de negócios."},{"text":"Nível 1 (instrumentação — sensores e atuadores) — corresponde aos dispositivos de campo que sensoreiam e atuam diretamente sobre o processo físico, comunicando-se tipicamente por redes <em>fieldbus</em>.","correct":true,"feedback":"Correto. O nível 1 da pirâmide de automação (ISA-95) é o nível dos sensores e atuadores que interagem diretamente com o processo físico, comunicando-se comumente por meio de redes de campo de baixo nível, como AS-i, HART ou os segmentos H1 do Fieldbus Foundation."},{"text":"Nível 2 (controle — CLPs e SCADA) — corresponde ao planejamento estratégico de longo prazo da manufatura, tipicamente executado por sistemas MES.","correct":false,"feedback":"O nível 2 corresponde ao controle e supervisão em tempo real (CLPs, SCADA), não ao planejamento estratégico — essa última função está mais associada aos níveis 3 (MES) e 4 (ERP), de horizontes de tempo mais longos."},{"text":"Nível 3 (MES) — corresponde à camada de sensores e atuadores que interagem fisicamente com a planta.","correct":false,"feedback":"Essa descrição corresponde ao nível 1, não ao nível 3. O MES (nível 3) é responsável pela gestão da execução da manufatura (ordens de produção, rastreabilidade, desempenho), e não pela interação física direta com o processo."},{"text":"Nível 4 (ERP / negócios) — corresponde ao controle em tempo real dos processos de produção, com ciclos de resposta em milissegundos.","correct":false,"feedback":"O controle em tempo real com ciclos de milissegundos é característico do nível 2 (CLPs/SCADA); o nível 4 (ERP) trata do planejamento de negócios em horizontes de tempo muito mais longos (dias, semanas, meses), sem relação direta com o controle em tempo real do processo."}]},{"id":25,"tag":"Questão inédita – Redes de Comunicação Industrial","statement":"Em redes Ethernet industrial, é comum a adoção de topologias em anel (<em>ring</em>) combinadas com protocolos de redundância, visando garantir a continuidade da comunicação mesmo em caso de falha de um enlace ou dispositivo. Avalie as afirmações a seguir.","image":null,"items":["Protocolos de redundância em anel, como o MRP (<em>Media Redundancy Protocol</em>) ou variantes proprietárias equivalentes, monitoram continuamente a integridade do anel e, ao detectarem a interrupção de um enlace, reconfiguram automaticamente os caminhos de encaminhamento para restabelecer a comunicação.","O tempo de reconfiguração (<em>failover</em>) de uma rede em anel industrial após a falha de um enlace é, em geral, significativamente menor que o tempo tipicamente exigido pelo <em>Spanning Tree Protocol</em> (STP) convencional de redes de TI corporativas.","Uma topologia em anel, por si só, já garante redundância de comunicação, independentemente de haver um protocolo de gerenciamento de redundância em execução na rede, pois o hardware da rede automaticamente contorna falhas.","Em uma topologia em anel com protocolo de redundância ativo, um dos enlaces do anel é mantido bloqueado durante a operação normal, para evitar loops e tempestades de <em>broadcast</em>, sendo reativado apenas em caso de falha em outro trecho do anel."],"items_intro":"É correto apenas o que se afirma em","alts":[{"text":"I e III.","correct":false,"feedback":"III é falsa: sem um protocolo de gerenciamento de redundância em execução, uma topologia física em anel em Ethernet causa loops e tempestades de broadcast, em vez de oferecer redundância automática — é o protocolo (como o MRP) que torna o anel seguro e redundante."},{"text":"I, II e IV.","correct":true,"feedback":"Correto. I é verdadeira: protocolos como o MRP monitoram o anel e reconfiguram o encaminhamento ao detectar falhas. II é verdadeira: o failover em redes de anel industrial é tipicamente muito mais rápido (na ordem de dezenas de milissegundos) que o STP convencional (que pode levar segundos). IV é verdadeira: um enlace é mantido bloqueado durante a operação normal para evitar loops, sendo reativado apenas em caso de falha. III é falsa, pois sem um protocolo de gerenciamento ativo, uma topologia física em anel causaria loops de camada 2 e tempestades de broadcast, em vez de oferecer redundância segura."},{"text":"II e III.","correct":false,"feedback":"III é falsa: uma topologia em anel sem um protocolo de redundância ativo (como o MRP) não contorna falhas automaticamente — ao contrário, tende a causar loops e tempestades de broadcast na rede."},{"text":"I, III e IV.","correct":false,"feedback":"III é falsa: é o protocolo de gerenciamento de redundância (não o simples cabeamento em anel) que garante a redundância segura, evitando loops através do bloqueio controlado de um enlace."},{"text":"I, II, III e IV.","correct":false,"feedback":"III é falsa: uma topologia em anel sem um protocolo de redundância ativo não garante, por si só, comunicação redundante — ela pode, inclusive, gerar loops de rede e tempestades de broadcast na ausência desse gerenciamento."}]}],"images":{"image1.png":"data:image/png;base64,iVBORw0KGgoAAAANSUh <script>
(function(){
  "use strict";
  var DATA = window.QUIZ_DATA;
  var QUESTIONS = DATA.questions;
  var IMAGES = DATA.images;
  var TOTAL = QUESTIONS.length;

  var state = {
    current: 0,
    answers: new Array(TOTAL).fill(null) // {altIndex, correct}
  };

  var quizArea = document.getElementById("quizArea");
  var progressFill = document.getElementById("progressFill");
  var progressLabel = document.getElementById("progressLabel");
  var footHint = document.getElementById("footHint");
  var indexGrid = document.getElementById("indexGrid");
  var indexGridTop = document.getElementById("indexGridTop");
  var actionsTop = document.getElementById("actionsTop");
  var prevBtnTop = document.getElementById("prevBtnTop");
  var nextBtnTop = document.getElementById("nextBtnTop");
  var onResults = false;

  function goPrev(){
    if(state.current > 0){ goTo(state.current-1); }
  }
  function goNext(){
    if(state.current === TOTAL-1){
      renderResults();
    } else {
      goTo(state.current+1);
    }
  }
  prevBtnTop.addEventListener('click', goPrev);
  nextBtnTop.addEventListener('click', goNext);

  function updateProgress(){
    var pct = Math.round(((state.current+1)/TOTAL)*100);
    progressFill.style.width = pct + "%";
    progressLabel.textContent = (state.current+1) + " / " + TOTAL;
  }

  function letter(i){ return String.fromCharCode(97+i); }

  function goTo(idx){
    onResults = false;
    renderQuestion(idx);
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function renderIndexNav(){
    var html = '';
    for(var i=0; i<TOTAL; i++){
      var a = state.answers[i];
      var cls = 'index-pill';
      if(a){ cls += a.correct ? ' ok' : ' bad'; }
      if(!onResults && i === state.current){ cls += ' current'; }
      html += '<button type="button" class="'+cls+'" data-goto="'+i+'" title="Questão '+(i+1)+(a ? (a.correct ? ' — acertou' : ' — errou') : ' — não respondida')+'">'+(i+1)+'</button>';
    }
    [indexGrid, indexGridTop].forEach(function(grid){
      if(!grid) return;
      grid.innerHTML = html;
      grid.querySelectorAll('.index-pill').forEach(function(p){
        p.addEventListener('click', function(){
          goTo(parseInt(p.getAttribute('data-goto'),10));
        });
      });
    });
  }

  function renderQuestion(idx){
    state.current = idx;
    var q = QUESTIONS[idx];
    var saved = state.answers[idx];

    var html = '';
    html += '<div class="card" role="group" aria-label="Questão '+(idx+1)+'">';
    html += '  <div class="qmeta">';
    html += '    <span class="qnum">QUESTÃO ' + String(idx+1).padStart(2,'0') + '</span>';
    html += '    <span class="qtag">' + q.tag + '</span>';
    html += '  </div>';
    html += '  <p class="qstatement">' + q.statement + '</p>';

    if(q.image){
      html += '<div class="qimg-wrap"><img class="qimg" src="' + IMAGES[q.image] + '" alt="Figura da questão ' + (idx+1) + '"></div>';
    }
    if(q.statement2){
      html += '<p class="qstatement">' + q.statement2 + '</p>';
    }
    if(q.image2){
      html += '<div class="qimg-wrap"><img class="qimg" style="max-width:480px" src="' + IMAGES[q.image2] + '" alt="Figura complementar da questão ' + (idx+1) + '"></div>';
    }
    if(q.statement3){
      html += '<p class="qstatement">' + q.statement3 + '</p>';
    }
    if(q.image3){
      html += '<div class="qimg-wrap"><img class="qimg" src="' + IMAGES[q.image3] + '" alt="Figura complementar da questão ' + (idx+1) + '"></div>';
    }
    if(q.statement4){
      html += '<p class="qstatement">' + q.statement4 + '</p>';
    }

    if(q.items){
      html += '<ul class="items-list">';
      var rn = ['I','II','III','IV','V'];
      q.items.forEach(function(it, i){
        html += '<li><span class="rn">'+rn[i]+'.</span><span>'+it+'</span></li>';
      });
      html += '</ul>';
      if(q.items_intro){
        html += '<p class="qstatement" style="font-weight:600;">' + q.items_intro + '</p>';
      }
    }

    html += '<div class="alts" id="altsBox">';
    q.alts.forEach(function(alt, i){
      html += '<button type="button" class="alt-btn" data-idx="'+i+'" '+(saved?'disabled':'')+'>';
      html += '  <span class="alt-letter">'+letter(i)+'</span>';
      html += '  <span class="alt-text">'+alt.text+'</span>';
      html += '  <svg class="alt-icon icon-check" viewBox="0 0 20 20" fill="none"><path d="M4 10.5l3.5 3.5L16 5.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      html += '  <svg class="alt-icon icon-x" viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      html += '</button>';
    });
    html += '</div>';

    html += '<div id="feedbackBox"></div>';

    var nextLabel = idx===TOTAL-1 ? 'Ver resultado final' : (saved ? 'Próxima questão' : 'Avançar sem responder');
    html += '<div class="actions">';
    html += '  <button class="btn-secondary" id="prevBtn" type="button" ' + (idx===0?'disabled':'') + '>← Questão anterior</button>';
    html += '  <button class="btn-primary" id="nextBtn" type="button">' + nextLabel + ' →</button>';
    html += '</div>';
    html += '</div>';

    quizArea.innerHTML = html;
    onResults = false;
    updateProgress();
    renderIndexNav();

    if(actionsTop) actionsTop.hidden = false;
    if(prevBtnTop) prevBtnTop.disabled = (idx===0);
    if(nextBtnTop) nextBtnTop.textContent = nextLabel + ' →';

    if(saved){
      applyAnswerUI(idx, saved.altIndex, true);
    } else {
      footHint.textContent = 'Clique em uma alternativa para ver o feedback imediato, ou avance sem responder.';
    }

    var buttons = quizArea.querySelectorAll('.alt-btn');
    buttons.forEach(function(btn){
      btn.addEventListener('click', function(){
        var i = parseInt(btn.getAttribute('data-idx'), 10);
        selectAnswer(idx, i);
      });
    });

    document.getElementById('prevBtn').addEventListener('click', goPrev);
    document.getElementById('nextBtn').addEventListener('click', goNext);
  }

  function selectAnswer(qIdx, altIdx){
    var q = QUESTIONS[qIdx];
    var correctIdx = q.alts.findIndex(function(a){ return a.correct; });
    var isCorrect = altIdx === correctIdx;
    state.answers[qIdx] = { altIndex: altIdx, correct: isCorrect };
    applyAnswerUI(qIdx, altIdx, false);
    renderIndexNav();
    var nextBtn = document.getElementById('nextBtn');
    if(nextBtn && qIdx !== TOTAL-1){ nextBtn.innerHTML = 'Próxima questão →'; }
    if(nextBtnTop && qIdx !== TOTAL-1){ nextBtnTop.innerHTML = 'Próxima questão →'; }
    footHint.textContent = isCorrect ? 'Boa! Confira a explicação abaixo.' : 'Confira abaixo por que essa alternativa está incorreta e qual é a certa.';
  }

  function applyAnswerUI(qIdx, chosenIdx, silent){
    var q = QUESTIONS[qIdx];
    var correctIdx = q.alts.findIndex(function(a){ return a.correct; });
    var buttons = quizArea.querySelectorAll('.alt-btn');
    buttons.forEach(function(btn){
      var i = parseInt(btn.getAttribute('data-idx'),10);
      btn.disabled = true;
      if(i === correctIdx){
        btn.classList.add('is-correct');
      } else if(i === chosenIdx){
        btn.classList.add('is-wrong');
      } else {
        btn.classList.add('is-muted');
      }
    });

    var chosenAlt = q.alts[chosenIdx];
    var correctAlt = q.alts[correctIdx];
    var isCorrect = chosenIdx === correctIdx;

    var fb = document.getElementById('feedbackBox');
    var html = '<div class="feedback ' + (isCorrect?'ok':'bad') + '">';
    html += '<div class="fb-title">' + (isCorrect ? '✓ Alternativa ' + letter(chosenIdx).toUpperCase() + ' correta' : '✕ Alternativa ' + letter(chosenIdx).toUpperCase() + ' incorreta') + '</div>';
    html += '<p>' + chosenAlt.feedback + '</p>';
    if(!isCorrect){
      html += '<div class="fb-correct-note"><strong>Resposta correta: ' + letter(correctIdx).toUpperCase() + '.</strong> ' + correctAlt.feedback + '</div>';
    }
    html += '</div>';
    fb.innerHTML = html;
  }

  function renderResults(){
    onResults = true;
    var correctCount = state.answers.filter(function(a){ return a && a.correct; }).length;
    var wrongCount = state.answers.filter(function(a){ return a && !a.correct; }).length;
    var pendingCount = TOTAL - correctCount - wrongCount;
    var pct = Math.round((correctCount/TOTAL)*100);
    var msg;
    if(pendingCount > 0){
      msg = pendingCount + ' questão(ões) ainda não respondida(s) — use o índice abaixo para completá-las.';
    } else if(pct >= 80){
      msg = 'Excelente domínio do conteúdo!';
    } else if(pct >= 60){
      msg = 'Bom resultado — revise os pontos que errou.';
    } else if(pct >= 40){
      msg = 'Você está no caminho — vale revisar os temas com mais atenção.';
    } else {
      msg = 'Bora revisar o conteúdo com calma antes da prova.';
    }

    var html = '<div class="card results-card">';
    html += '<div class="qnum" style="margin:0 auto 14px;display:inline-block;">RESUMO FINAL</div>';
    html += '<div class="score-ring">' + ringSvg(pct) + '<div class="score-num"><b>'+correctCount+'/'+TOTAL+'</b><span>'+pct+'% de acerto</span></div></div>';
    html += '<p class="score-msg">' + msg + '</p>';

    html += '<div class="stat-row">';
    html += '  <div class="stat-chip ok"><b>'+correctCount+'</b><span>acertos</span></div>';
    html += '  <div class="stat-chip bad"><b>'+wrongCount+'</b><span>erros</span></div>';
    html += '  <div class="stat-chip"><b>'+pendingCount+'</b><span>não respondidas</span></div>';
    html += '</div>';

    html += '<div class="summary-list">';
    QUESTIONS.forEach(function(q, i){
      var a = state.answers[i];
      var correctIdx = q.alts.findIndex(function(al){ return al.correct; });
      var rowCls = 'summary-row ' + (a ? (a.correct ? 'ok' : 'bad') : 'pending');
      var ansText;
      if(a){
        ansText = a.correct
          ? ('✓ ' + letter(a.altIndex).toUpperCase())
          : ('✕ ' + letter(a.altIndex).toUpperCase() + ' · correta: ' + letter(correctIdx).toUpperCase());
      } else {
        ansText = 'não respondida';
      }
      html += '<div class="'+rowCls+'" data-goto="'+i+'">';
      html += '  <span class="sq">Q' + String(i+1).padStart(2,'0') + '</span>';
      html += '  <span class="stag">' + q.tag + '</span>';
      html += '  <span class="sans">' + ansText + '</span>';
      html += '</div>';
    });
    html += '</div>';

    html += '<div class="results-actions">';
    html += '<button class="btn-secondary" id="restartBtn" type="button">Refazer do início</button>';
    html += '<button class="btn-primary" id="reviewBtn" type="button">Revisar 1ª questão</button>';
    html += '</div>';
    html += '</div>';

    quizArea.innerHTML = html;
    progressFill.style.width = '100%';
    progressLabel.textContent = TOTAL + ' / ' + TOTAL;
    footHint.textContent = 'Toque em uma questão (aqui ou no índice abaixo) para revisá-la.';
    if(actionsTop) actionsTop.hidden = true;
    renderIndexNav();

    document.getElementById('restartBtn').addEventListener('click', function(){
      state.answers = new Array(TOTAL).fill(null);
      goTo(0);
    });
    document.getElementById('reviewBtn').addEventListener('click', function(){
      goTo(0);
    });
    quizArea.querySelectorAll('.summary-row').forEach(function(c){
      c.addEventListener('click', function(){
        goTo(parseInt(c.getAttribute('data-goto'),10));
      });
    });
  }

  function ringSvg(pct){
    var r = 58, c = 2*Math.PI*r;
    var off = c * (1 - pct/100);
    var color = pct>=60 ? 'var(--correct)' : (pct>=40 ? 'var(--primary)' : 'var(--wrong)');
    return '<svg width="132" height="132" viewBox="0 0 132 132">' +
      '<circle cx="66" cy="66" r="'+r+'" fill="none" stroke="var(--border)" stroke-width="10"/>' +
      '<circle cx="66" cy="66" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="10" stroke-linecap="round" ' +
      'stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 66 66)"/>' +
      '</svg>';
  }

  // theme toggle: cycles system -> light -> dark -> system
  var root = document.documentElement;
  var themeBtn = document.getElementById('themeToggle');
  function applyThemeLabel(){
    var t = root.getAttribute('data-theme');
    themeBtn.textContent = t === 'dark' ? 'Tema: Escuro' : (t === 'light' ? 'Tema: Claro' : 'Tema: Auto');
  }
  themeBtn.addEventListener('click', function(){
    var t = root.getAttribute('data-theme');
    if(!t){ root.setAttribute('data-theme','dark'); }
    else if(t === 'dark'){ root.setAttribute('data-theme','light'); }
    else { root.removeAttribute('data-theme'); }
    applyThemeLabel();
  });
  applyThemeLabel();

  renderQuestion(0);
})();
</script>

</body>
</html>
