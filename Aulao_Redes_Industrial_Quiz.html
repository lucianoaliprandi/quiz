<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redes e Comunicação Industrial</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

  :root{
    --bg:#F3F6FB;
    --bg-grid:#E4EAF4;
    --surface:#FFFFFF;
    --surface-2:#F7F9FC;
    --text:#101A2C;
    --text-muted:#54627C;
    --text-faint:#8996AD;
    --primary:#154C96;
    --primary-ink:#ffffff;
    --primary-dim:#E7EFFB;
    --accent:#0E7C86;
    --accent-dim:#E3F3F3;
    --border:#DBE2EE;
    --border-strong:#C2CCDD;
    --correct:#1B8A5A;
    --correct-bg:#E7F5EE;
    --correct-border:#A9DBC1;
    --wrong:#C1352E;
    --wrong-bg:#FBEAE9;
    --wrong-border:#EFBBB7;
    --shadow: 0 1px 2px rgba(16,26,44,.04), 0 8px 24px -12px rgba(16,26,44,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0A1220;
      --bg-grid:#101C31;
      --surface:#101B2E;
      --surface-2:#0D1626;
      --text:#E8EDF7;
      --text-muted:#98A6C2;
      --text-faint:#6C7996;
      --primary:#6CA2F2;
      --primary-ink:#07142A;
      --primary-dim:#15233D;
      --accent:#4FC7CF;
      --accent-dim:#0F2A2C;
      --border:#22314F;
      --border-strong:#324670;
      --correct:#4FD397;
      --correct-bg:#0F2A20;
      --correct-border:#1F5C41;
      --wrong:#FF8A82;
      --wrong-bg:#341413;
      --wrong-border:#6B2723;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A1220;
    --bg-grid:#101C31;
    --surface:#101B2E;
    --surface-2:#0D1626;
    --text:#E8EDF7;
    --text-muted:#98A6C2;
    --text-faint:#6C7996;
    --primary:#6CA2F2;
    --primary-ink:#07142A;
    --primary-dim:#15233D;
    --accent:#4FC7CF;
    --accent-dim:#0F2A2C;
    --border:#22314F;
    --border-strong:#324670;
    --correct:#4FD397;
    --correct-bg:#0F2A20;
    --correct-border:#1F5C41;
    --wrong:#FF8A82;
    --wrong-bg:#341413;
    --wrong-border:#6B2723;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 100% -10%, var(--bg-grid), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .mono{font-family:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;}

  /* faint network-node backdrop */
  .netbg{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    opacity:.5;
  }
  :root[data-theme="dark"] .netbg, @media (prefers-color-scheme: dark){ .netbg{ opacity:.35; } }

  .wrap{
    position:relative; z-index:1;
    max-width:840px;
    margin:0 auto;
    padding:28px 20px 64px;
  }

  header.top{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; margin-bottom:22px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 3px var(--accent-dim);
  }
  .brand h1{
    font-size:15px; font-weight:600; letter-spacing:.01em; margin:0;
    color:var(--text);
  }
  .brand span{display:block; font-size:12px; color:var(--text-muted); font-weight:400;}

  .theme-toggle{
    font-family:inherit; font-size:12px; font-weight:500;
    color:var(--text-muted); background:var(--surface);
    border:1px solid var(--border); border-radius:8px;
    padding:6px 10px; cursor:pointer;
  }
  .theme-toggle:hover{border-color:var(--border-strong); color:var(--text);}

  .header-actions{ display:flex; align-items:center; gap:8px; flex:none; }
  .btn-home{
    font-family:inherit; font-size:12px; font-weight:500;
    color:var(--text-muted); background:var(--surface);
    border:1px solid var(--border); border-radius:8px;
    padding:6px 10px; cursor:pointer; text-decoration:none;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .btn-home:hover{border-color:var(--border-strong); color:var(--text);}

  /* duplicated navigation block near the top of the page */
  .top-nav{
    margin-bottom:22px; padding-bottom:20px; border-bottom:1px solid var(--border);
  }
  .top-nav .index-nav{ margin-top:0; padding-top:0; border-top:none; }
  .top-nav .actions{ margin-top:16px; }

  /* progress */
  .progress-row{
    display:flex; align-items:center; gap:12px; margin-bottom:22px;
  }
  .progress-track{
    flex:1; height:6px; border-radius:999px; background:var(--border);
    overflow:hidden;
  }
  .progress-fill{
    height:100%; background:linear-gradient(90deg, var(--accent), var(--primary));
    border-radius:999px; transition:width .35s ease;
    width:0%;
  }
  .progress-label{
    font-size:12px; color:var(--text-muted); white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }

  /* card */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:28px 28px 24px;
  }
  @media (max-width:560px){ .card{padding:20px 18px 18px;} }

  .qmeta{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px; gap:10px; flex-wrap:wrap;
  }
  .qnum{
    font-family:"IBM Plex Mono", monospace;
    font-size:12px; font-weight:600; color:var(--primary);
    background:var(--primary-dim);
    border-radius:999px; padding:4px 10px;
    letter-spacing:.02em;
  }
  .qtag{
    font-family:"IBM Plex Mono", monospace;
    font-size:11.5px; color:var(--text-muted);
    letter-spacing:.01em;
  }

  .qstatement{
    font-size:16.5px; line-height:1.62; color:var(--text);
    margin:0 0 14px;
  }
  .qstatement strong{font-weight:600;}
  .qstatement em{font-style:italic; color:var(--text);}

  .qimg{
    display:block; max-width:100%; margin:14px auto; border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface-2);
  }
  .qimg-wrap{ overflow-x:auto; text-align:center; }

  .items-list{
    list-style:none; margin:12px 0 16px; padding:0;
    display:flex; flex-direction:column; gap:8px;
  }
  .items-list li{
    display:flex; gap:10px; font-size:15px; line-height:1.55;
    color:var(--text); background:var(--surface-2);
    border:1px solid var(--border); border-radius:10px;
    padding:9px 12px;
  }
  .items-list .rn{
    font-family:"IBM Plex Mono", monospace; font-weight:700;
    color:var(--accent); flex:none; width:24px;
  }

  .alts{
    display:flex; flex-direction:column; gap:9px; margin-top:18px;
  }
  .alt-btn{
    display:flex; align-items:flex-start; gap:12px;
    width:100%; text-align:left;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    font-family:inherit; font-size:15px; line-height:1.5; color:var(--text);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .alt-btn:hover:not(:disabled){
    border-color:var(--border-strong);
    background:var(--surface);
  }
  .alt-btn:active:not(:disabled){ transform:scale(.997); }
  .alt-btn:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }
  .alt-btn:disabled{ cursor:default; }

  .alt-letter{
    font-family:"IBM Plex Mono", monospace; font-weight:700; font-size:13px;
    flex:none; width:26px; height:26px; border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--border-strong);
    color:var(--text-muted);
  }
  .alt-text{flex:1; padding-top:1px;}
  .alt-icon{flex:none; width:20px; height:20px; margin-top:2px; display:none;}

  .alt-btn.is-correct{
    background:var(--correct-bg); border-color:var(--correct-border);
  }
  .alt-btn.is-correct .alt-letter{ background:var(--correct); border-color:var(--correct); color:#fff; }
  .alt-btn.is-correct .alt-icon.icon-check{ display:block; }

  .alt-btn.is-wrong{
    background:var(--wrong-bg); border-color:var(--wrong-border);
  }
  .alt-btn.is-wrong .alt-letter{ background:var(--wrong); border-color:var(--wrong); color:#fff; }
  .alt-btn.is-wrong .alt-icon.icon-x{ display:block; }

  .alt-btn.is-muted{ opacity:.55; }

  .feedback{
    margin-top:16px; border-radius:12px; padding:14px 16px;
    border:1px solid var(--border); background:var(--surface-2);
    font-size:14.5px; line-height:1.6;
    animation:slideIn .25s ease;
  }
  .feedback.ok{ background:var(--correct-bg); border-color:var(--correct-border); }
  .feedback.bad{ background:var(--wrong-bg); border-color:var(--wrong-border); }
  .feedback .fb-title{
    font-weight:700; font-size:13px; letter-spacing:.01em;
    display:flex; align-items:center; gap:7px; margin-bottom:5px;
  }
  .feedback.ok .fb-title{ color:var(--correct); }
  .feedback.bad .fb-title{ color:var(--wrong); }
  .feedback p{ margin:0; color:var(--text); }
  .feedback .fb-correct-note{
    margin-top:8px; padding-top:8px; border-top:1px dashed var(--border-strong);
    color:var(--text-muted); font-size:13.5px;
  }

  @keyframes slideIn{ from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);} }

  .actions{
    display:flex; justify-content:space-between; align-items:center; margin-top:20px; gap:10px;
  }
  .btn-primary{
    font-family:inherit; font-weight:600; font-size:14.5px;
    background:var(--primary); color:var(--primary-ink);
    border:none; border-radius:10px; padding:11px 20px;
    cursor:pointer; display:inline-flex; align-items:center; gap:8px;
    transition:opacity .15s ease, transform .1s ease;
  }
  .btn-primary:hover{ opacity:.92; }
  .btn-primary:active{ transform:scale(.98); }
  .btn-primary:disabled{ opacity:.4; cursor:not-allowed; }

  .btn-secondary{
    font-family:inherit; font-weight:600; font-size:14.5px;
    background:transparent; color:var(--primary);
    border:1px solid var(--border-strong); border-radius:10px; padding:10px 18px;
    cursor:pointer; display:inline-flex; align-items:center; gap:8px;
  }
  .btn-secondary:hover:not(:disabled){ background:var(--primary-dim); }
  .btn-secondary:disabled{ opacity:.35; cursor:not-allowed; }

  .btn-ghost{
    font-family:inherit; font-weight:500; font-size:13.5px;
    background:transparent; color:var(--text-muted);
    border:1px solid transparent; border-radius:10px; padding:10px 14px;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  .btn-ghost:hover:not(:disabled){ color:var(--text); background:var(--surface-2); }
  .btn-ghost:disabled{ opacity:.3; cursor:not-allowed; }

  .hint{
    text-align:center; margin-top:18px; font-size:12.5px; color:var(--text-faint);
  }

  /* question index (footer nav) */
  .index-nav{
    margin-top:20px; padding-top:18px; border-top:1px solid var(--border);
  }
  .index-legend{
    display:flex; gap:16px; justify-content:center; flex-wrap:wrap;
    font-size:11.5px; color:var(--text-muted); margin-bottom:12px;
  }
  .index-legend .lg-item{ display:flex; align-items:center; gap:6px; }
  .index-legend .swatch{
    width:11px; height:11px; border-radius:3.5px; display:inline-block;
    border:1px solid var(--border-strong); background:var(--surface-2);
  }
  .swatch.ok{ background:var(--correct-bg); border-color:var(--correct-border); }
  .swatch.bad{ background:var(--wrong-bg); border-color:var(--wrong-border); }
  .swatch.cur{ background:var(--primary-dim); border-color:var(--primary); }

  .index-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(30px, 1fr)); gap:5px;
  }
  @media (max-width:720px){ .index-grid{ grid-template-columns:repeat(auto-fill, minmax(28px, 1fr));} }
  @media (max-width:420px){ .index-grid{ grid-template-columns:repeat(auto-fill, minmax(26px, 1fr));} }
  .index-pill{
    aspect-ratio:1; border-radius:6px; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-family:"IBM Plex Mono", monospace; font-size:10.5px; font-weight:600;
    color:var(--text-muted); background:var(--surface-2);
    cursor:pointer; transition:border-color .12s ease, transform .08s ease;
  }
  .index-pill:hover{ border-color:var(--border-strong); transform:translateY(-1px); }
  .index-pill.ok{ background:var(--correct-bg); border-color:var(--correct-border); color:var(--correct); }
  .index-pill.bad{ background:var(--wrong-bg); border-color:var(--wrong-border); color:var(--wrong); }
  .index-pill.current{
    border-color:var(--primary); border-width:2px; color:var(--primary);
    box-shadow:0 0 0 2px var(--primary-dim); font-weight:700;
  }

  /* results screen */
  .results-card{ text-align:center; }
  .score-ring{
    width:132px; height:132px; margin:6px auto 8px; position:relative;
  }
  .score-num{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .score-num b{ font-family:"IBM Plex Mono", monospace; font-size:30px; color:var(--text); }
  .score-num span{ font-size:11.5px; color:var(--text-muted); margin-top:2px; }
  .score-msg{ font-size:15px; color:var(--text-muted); margin:6px 0 22px; }

  .stat-row{
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
    margin:0 0 22px;
  }
  .stat-chip{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    border:1px solid var(--border); border-radius:12px; padding:10px 18px;
    background:var(--surface-2); min-width:84px;
  }
  .stat-chip b{ font-family:"IBM Plex Mono", monospace; font-size:19px; color:var(--text); }
  .stat-chip span{ font-size:11px; color:var(--text-muted); }
  .stat-chip.ok b{ color:var(--correct); }
  .stat-chip.bad b{ color:var(--wrong); }

  .summary-list{
    display:flex; flex-direction:column; gap:7px; margin:0 0 22px; text-align:left;
  }
  .summary-row{
    display:flex; align-items:center; gap:12px;
    border:1px solid var(--border); border-radius:10px;
    padding:10px 14px; background:var(--surface-2);
    cursor:pointer; transition:border-color .12s ease;
  }
  .summary-row:hover{ border-color:var(--border-strong); }
  .summary-row.ok{ background:var(--correct-bg); border-color:var(--correct-border); }
  .summary-row.bad{ background:var(--wrong-bg); border-color:var(--wrong-border); }
  .summary-row.pending{ opacity:.65; }
  .summary-row .sq{
    font-family:"IBM Plex Mono", monospace; font-weight:700; font-size:12.5px;
    color:var(--text-muted); flex:none; width:30px;
  }
  .summary-row .stag{
    flex:1; min-width:0; font-size:12px; color:var(--text-faint);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .summary-row .sans{
    font-family:"IBM Plex Mono", monospace; font-size:12.5px; font-weight:600;
    flex:none; color:var(--text-muted); white-space:nowrap;
  }
  .summary-row.ok .sans{ color:var(--correct); }
  .summary-row.bad .sans{ color:var(--wrong); }

  .results-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  [hidden]{ display:none !important; }
</style>
</head>
<body>


<svg class="netbg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <g fill="none" stroke="var(--border)" stroke-width="1">
    <line x1="60" y1="90" x2="230" y2="180"/>
    <line x1="230" y1="180" x2="180" y2="330"/>
    <line x1="230" y1="180" x2="420" y2="120"/>
    <line x1="420" y1="120" x2="560" y2="230"/>
    <line x1="560" y1="230" x2="760" y2="150"/>
    <line x1="560" y1="230" x2="640" y2="400"/>
    <line x1="180" y1="330" x2="360" y2="420"/>
    <line x1="360" y1="420" x2="640" y2="400"/>
    <line x1="360" y1="420" x2="300" y2="600"/>
    <line x1="640" y1="400" x2="820" y2="520"/>
    <line x1="760" y1="150" x2="860" y2="320"/>
    <line x1="860" y1="320" x2="820" y2="520"/>
  </g>
  <g fill="var(--border-strong)">
    <circle cx="60" cy="90" r="4"/>
    <circle cx="230" cy="180" r="4"/>
    <circle cx="420" cy="120" r="4"/>
    <circle cx="560" cy="230" r="4"/>
    <circle cx="760" cy="150" r="4"/>
    <circle cx="180" cy="330" r="4"/>
    <circle cx="360" cy="420" r="4"/>
    <circle cx="640" cy="400" r="4"/>
    <circle cx="300" cy="600" r="4"/>
    <circle cx="820" cy="520" r="4"/>
    <circle cx="860" cy="320" r="4"/>
  </g>
</svg>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>Redes e Comunicação Industrial</h1>
        <span>Fieldbus · Ethernet Industrial · OSI · IoT — Revisão ENADE</span>
      </div>
    </div>
  </header>

   <div class="header-actions">
      <a class="btn-home" href="index.html" title="Voltar para a página inicial">← Início</a>
      <button class="theme-toggle" id="themeToggle" type="button">Tema</button>
    </div>
  
  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label mono" id="progressLabel">1 / 25</div>
  </div>

  <div class="top-nav" id="topNav">
    <nav class="index-nav" id="indexNavTop" aria-label="Índice de questões (topo)">
      <div class="index-legend">
        <span class="lg-item"><span class="swatch cur"></span> questão atual</span>
        <span class="lg-item"><span class="swatch ok"></span> acertou</span>
        <span class="lg-item"><span class="swatch bad"></span> errou</span>
        <span class="lg-item"><span class="swatch"></span> não respondida</span>
      </div>
      <div class="index-grid" id="indexGridTop"></div>
    </nav>
    <div class="actions" id="actionsTop">
      <button class="btn-secondary" id="prevBtnTop" type="button">← Questão anterior</button>
      <button class="btn-primary" id="nextBtnTop" type="button">Avançar sem responder →</button>
    </div>
  </div>

  <main id="quizArea"></main>

  <footer>
    <p class="hint" id="footHint">Clique em uma alternativa para ver o feedback imediato.</p>
    <nav class="index-nav" id="indexNav" aria-label="Índice de questões">
      <div class="index-legend">
        <span class="lg-item"><span class="swatch cur"></span> questão atual</span>
        <span class="lg-item"><span class="swatch ok"></span> acertou</span>
        <span class="lg-item"><span class="swatch bad"></span> errou</span>
        <span class="lg-item"><span class="swatch"></span> não respondida</span>
      </div>
      <div class="index-grid" id="indexGrid"></div>
    </nav>
  </footer>
</div>

<script>
window.QUIZ_DATA = {"questions":[{"id":1,"tag":"ENADE 2017 – Engenharia de Controle e Automação","statement":"A figura a seguir apresenta os diferentes níveis hierárquicos de um sistema de automação industrial.","image":"image1.png","statement2":"Considerando a figura apresentada e os diferentes padrões utilizados para redes de comunicação industrial, avalie as afirmações a seguir.","items":["Os protocolos de comunicação projetados para os níveis 1 e 2 devem atender a critérios relacionados à velocidade de transmissão e à imunidade ao ruído.","Protocolos de comunicação como CAN e AS-i são utilizados para estabelecer a comunicação entre os níveis hierárquicos 2 e 3.","A complexidade da informação transmitida aumenta com o nível hierárquico, ao passo que os requisitos de resposta em tempo real diminuem.","Se a comunicação entre os níveis 2 e 3 for interrompida, recomenda-se, por segurança, interromper também a comunicação entre os níveis 1 e 2."],"items_intro":"É correto apenas o que se afirma em","alts":[{"text":"I e II.","correct":false,"feedback":"II é falsa: CAN e AS-i são protocolos de nível de campo (sensores/atuadores), usados na comunicação entre os níveis 1 e 2, e não entre os níveis 2 e 3."},{"text":"I e III.","correct":true,"feedback":"Correto. I é verdadeira: nos níveis mais baixos (chão de fábrica), a velocidade de resposta e a imunidade a ruído eletromagnético são critérios essenciais. III é verdadeira: à medida que se sobe na pirâmide de automação, a informação se torna mais agregada/complexa (relatórios, indicadores), enquanto a exigência de resposta em tempo real diminui."},{"text":"II e IV.","correct":false,"feedback":"II é falsa (CAN/AS-i operam entre os níveis 1 e 2, não 2 e 3) e IV é falsa: por segurança, os laços de controle locais (níveis 1-2) devem continuar operando de forma autônoma mesmo que a comunicação com níveis superiores seja perdida — interrompê-los pioraria a segurança do processo."},{"text":"I, III e IV.","correct":false,"feedback":"IV é falsa: interromper a comunicação de campo (níveis 1-2) por causa de uma falha em um nível superior comprometeria o controle local do processo, que deve permanecer operante por questões de segurança."},{"text":"II, III e IV.","correct":false,"feedback":"II é falsa (CAN/AS-i atuam entre níveis 1 e 2) e IV é falsa (interromper os níveis 1-2 não é a prática de segurança recomendada nesse cenário)."}]},{"id":2,"tag":"ENADE 2017 – Engenharia de Controle e Automação","statement":"Fieldbus Foundation é uma arquitetura aberta para integrar informação, cujo objetivo principal é interconectar equipamentos de controle e automação industrial, distribuindo funções de controle pela rede e fornecendo informações a todas as camadas do sistema, conforme representado na figura a seguir.","image":"image2.png","statement2":"A respeito dessa temática e com base nas informações apresentadas, avalie as afirmações a seguir.","items":["A topologia de barramento com <em>Spurs</em> se caracteriza pela ligação em série de todos os instrumentos utilizados na aplicação.","A rede de serviço HSE baseia-se na mesma camada física <em>Ethernet</em>, operando com o protocolo TCP/IP.","As redes H1 e HSE pertencem a diferentes camadas físicas e ambas as redes operam com a mesma velocidade de transmissão.","A rede H1 representa uma solução de comunicação digital para o chão de fábrica em áreas classificadas."],"items_intro":"É correto apenas o que se afirma em","alts":[{"text":"I e III.","correct":false,"feedback":"I é falsa: na topologia de barramento com spurs, os instrumentos não ficam ligados em série — eles são conectados ao tronco (trunk) por meio de derivações (spurs) individuais. III também é falsa."},{"text":"I e IV.","correct":false,"feedback":"I é falsa: a característica de ligação em série descreve uma topologia \"daisy chain\", não a de barramento com spurs, na qual cada instrumento é derivado do tronco principal por um cabo de derivação próprio."},{"text":"II e IV.","correct":true,"feedback":"Correto. II é verdadeira: a rede HSE (High Speed Ethernet) da Fieldbus Foundation utiliza a camada física Ethernet padrão com TCP/IP, operando a 100 Mbit/s. IV é verdadeira: a rede H1 (31,25 kbit/s) foi projetada para comunicação digital de instrumentos de campo, inclusive com segurança intrínseca para uso em áreas classificadas (com risco de explosão)."},{"text":"I, II e III.","correct":false,"feedback":"I é falsa (spurs não ligam os instrumentos em série) e III é falsa: H1 e HSE não operam na mesma velocidade — H1 opera a 31,25 kbit/s e HSE a 100 Mbit/s, além de terem camadas físicas distintas."},{"text":"II, III e IV.","correct":false,"feedback":"III é falsa: H1 e HSE têm camadas físicas e velocidades de transmissão diferentes (31,25 kbit/s contra 100 Mbit/s) — não operam com a mesma velocidade."}]},{"id":3,"tag":"ENADE 2017 – Engenharia de Controle e Automação","statement":"A Internet das Coisas (IoT – <em>Internet of Things</em>) pode ser conceituada como a comunicação de objetos diversos via internet, que trocam informações como medições, localização, funcionalidades, falhas etc. Tais dados permitem, em determinadas situações, que o próprio sistema tome decisões sem intervenção humana.<br><br>Suponha o desenvolvimento de um sistema IoT para monitorar o consumo de energia elétrica residencial com sensores, microcontroladores e módulos de comunicação sem fio. Como teste inicial, será monitorado o consumo de energia elétrica de uma lâmpada, como mostra o diagrama simplificado da figura 1. O sistema coleta os dados e os envia a cada 24 horas para uma plataforma na internet.","image":"image3.png","statement2":"As informações enviadas para o módulo de comunicação sem fio devem estar organizadas em um quadro (<em>frame</em>) de dados obedecendo à estrutura mostrada na figura 2. Considere que o módulo de comunicação sem fio já está configurado, e que ao receber os dados do microcontrolador ele os envia automaticamente para a internet.","image2":"image4.png","statement3":"A figura 3 mostra o código desenvolvido para o microcontrolador. Considere que as funções utilizadas no código fazem parte da biblioteca \"iot.h\".","image3":"image5.png","statement4":"A respeito do código apresentado na figura 3, avalie as afirmações a seguir.","items":["A instrução da linha 30 é utilizada de maneira correta para a especificação da energia.","Devido à configuração da comunicação serial do microcontrolador, o <em>frame</em> precisa ser fragmentado para o envio de dados.","O programa faz uso de interrupção, o que torna o microcontrolador mais eficiente em termos de processamento e consumo de energia."],"items_intro":"É correto o que se afirma em","alts":[{"text":"I, apenas.","correct":false,"feedback":"I é falsa: a instrução da linha 30 não preenche corretamente o campo de energia do frame conforme a estrutura definida na figura 2 (há incompatibilidade entre o valor/tipo atribuído e o campo esperado)."},{"text":"II, apenas.","correct":true,"feedback":"Correto. Apenas a afirmação II é verdadeira: dado o tamanho do buffer/configuração da comunicação serial do microcontrolador em relação ao tamanho total do frame definido na figura 2, o quadro precisa ser fragmentado em partes menores para ser efetivamente transmitido ao módulo de comunicação sem fio. I é falsa (uso incorreto do campo de energia na linha 30) e III é falsa (o código não emprega uma rotina de tratamento de interrupção; o envio periódico é implementado por um laço de espera/temporização, não por interrupção)."},{"text":"I e III, apenas.","correct":false,"feedback":"Nem I nem III se sustentam: a linha 30 não usa corretamente o campo de energia do frame, e o código não implementa uma interrupção de fato — apenas II é verdadeira."},{"text":"II e III, apenas.","correct":false,"feedback":"III é falsa: o programa não utiliza um mecanismo de interrupção; a temporização do envio (a cada 24h) é feita de forma sequencial/por espera ativa no código, não por uma rotina de interrupção associada a um evento de hardware."},{"text":"I, II e III.","correct":false,"feedback":"I é falsa (uso incorreto do campo de energia na linha 30) e III é falsa (não há uso de interrupção no código) — apenas II está correta."}]},{"id":4,"tag":"Questão inédita – Redes de Comunicação Industrial","statement":"Uma indústria decidiu modernizar sua planta substituindo instrumentos analógicos por instrumentos inteligentes conectados aos CLPs por meio de uma rede Fieldbus, enquanto os CLPs se comunicam com o sistema SCADA por meio de uma rede Ethernet industrial (arquitetura SCADA – Ethernet industrial – CLP – Fieldbus – dispositivos de campo). Ao especificar os equipamentos, a equipe de engenharia precisa escolher protocolos compatíveis com as características de cada camada de rede.<br><br>Assinale a alternativa que apresenta corretamente um protocolo adequado para uso na rede Ethernet industrial e um protocolo adequado para uso na rede Fieldbus, respectivamente.","image":null,"alts":[{"text":"Modbus TCP / PROFINET.","correct":false,"feedback":"PROFINET é um protocolo de Ethernet industrial, não de Fieldbus — a ordem e a classificação estão trocadas nessa alternativa."},{"text":"PROFINET / EtherNet/IP.","correct":false,"feedback":"Tanto PROFINET quanto EtherNet/IP são protocolos de Ethernet industrial; nenhum dos dois é um protocolo de Fieldbus clássico, portanto a alternativa não atende ao pedido."},{"text":"EtherNet/IP / FOUNDATION Fieldbus H1.","correct":true,"feedback":"Correto. EtherNet/IP é um protocolo de Ethernet industrial (baseado em TCP/IP e CIP) adequado para a rede entre CLP e SCADA, enquanto FOUNDATION Fieldbus H1 é um protocolo de Fieldbus clássico, adequado para a comunicação entre CLP e instrumentos de campo."},{"text":"FOUNDATION Fieldbus H1 / HART.","correct":false,"feedback":"FOUNDATION Fieldbus H1 é um protocolo de Fieldbus, não de Ethernet industrial — a alternativa inverte as classificações pedidas."},{"text":"HART / Modbus TCP.","correct":false,"feedback":"HART não é um protocolo de Ethernet industrial (é um protocolo híbrido analógico/digital de instrumentação), e Modbus TCP é de Ethernet industrial, não de Fieldbus — a ordem está invertida."}]},{"id":5,"tag":"Questão inédita – Redes de Comunicação Industrial","statement":"Ao comparar os protocolos utilizados nas redes Ethernet industrial e Fieldbus de uma arquitetura de automação industrial, um engenheiro levantou um conjunto de afirmações técnicas para orientar a escolha dos equipamentos de uma nova planta.<br><br>Avalie as afirmações a seguir.","image":null,"items":["As redes Fieldbus, em geral, operam com taxas de transmissão menores que as redes Ethernet industrial, o que é compatível com a necessidade de alimentar instrumentos diretamente pelo próprio barramento de sinal.","As redes Ethernet industrial utilizam <em>switches</em> e permitem topologias em estrela ou anel, enquanto muitas redes Fieldbus utilizam topologia de barramento com derivações (<em>spurs</em>).","Os protocolos Fieldbus, por operarem em baixa velocidade, não podem ser utilizados em áreas classificadas (com risco de explosão), sendo essa aplicação exclusiva das redes Ethernet industrial.","Devido à limitação de banda, os quadros (<em>frames</em>) trafegados nas redes Fieldbus costumam ter menor capacidade de carga útil (<em>payload</em>) que os quadros Ethernet."],"items_intro":"É correto apenas o que se afirma em","alts":[{"text":"I e II.","correct":false,"feedback":"IV também é verdadeira: a limitação de banda das redes Fieldbus se reflete diretamente em quadros com menor payload em comparação aos quadros Ethernet, que suportam cargas úteis maiores."},{"text":"I, II e IV.","correct":true,"feedback":"Correto. I é verdadeira: a baixa velocidade do Fieldbus é compatível com a alimentação de instrumentos pelo próprio barramento (bus-powered). II é verdadeira: Ethernet industrial usa switches em estrela/anel, enquanto muitos Fieldbus usam barramento com spurs. IV é verdadeira: a limitação de banda do Fieldbus resulta em payloads menores. III é falsa, pois é justamente o Fieldbus (como o H1, com segurança intrínseca) que é amplamente usado em áreas classificadas — não o contrário."},{"text":"II e III.","correct":false,"feedback":"III é falsa: protocolos Fieldbus como o FOUNDATION Fieldbus H1 são amplamente empregados em áreas classificadas por meio de técnicas de segurança intrínseca, ao contrário do que a afirmação sugere."},{"text":"I, III e IV.","correct":false,"feedback":"III é falsa: a aplicação em áreas classificadas não é exclusiva da Ethernet industrial — pelo contrário, o Fieldbus H1 é historicamente uma das soluções mais utilizadas nesse cenário."},{"text":"I, II, III e IV.","correct":false,"feedback":"III é falsa: redes Fieldbus (como o H1) são comumente utilizadas em áreas classificadas com risco de explosão, o que contraria a afirmação de que essa aplicação seria exclusiva da Ethernet industrial."}]},{"id":6,"tag":"Questão inédita – Redes de Comunicação Industrial","statement":"Na arquitetura de uma planta industrial, os dispositivos de campo (sensores, transmissores e atuadores) comunicam-se com os CLPs por meio de uma rede Fieldbus, enquanto o sistema SCADA comunica-se com os CLPs por meio de uma rede Ethernet industrial. Não há nenhuma ligação direta entre o SCADA e a rede Fieldbus.<br><br>Considerando essa arquitetura, assinale a alternativa que descreve corretamente como o sistema SCADA obtém os dados dos dispositivos de campo conectados à rede Fieldbus.","image":null,"alts":[{"text":"O SCADA acessa diretamente os dispositivos de campo, pois o protocolo Fieldbus é roteável na internet (TCP/IP), dispensando qualquer intermediário.","correct":false,"feedback":"Protocolos Fieldbus clássicos (como o H1) não são nativamente roteáveis em TCP/IP nem acessíveis diretamente pela internet — a premissa da alternativa está incorreta."},{"text":"O CLP atua como um <em>gateway</em>, convertendo/traduzindo os dados recebidos via protocolo Fieldbus para o protocolo utilizado na rede Ethernet industrial, disponibilizando-os para leitura do SCADA.","correct":true,"feedback":"Correto. O CLP funciona como elemento de interconexão (gateway) entre as duas redes: ele coleta os dados dos dispositivos de campo via Fieldbus e os disponibiliza, já convertidos/mapeados, para o sistema SCADA por meio da rede Ethernet industrial."},{"text":"O SCADA envia comandos de <em>broadcast</em> pela rede Ethernet industrial, que são retransmitidos automaticamente por todos os dispositivos de campo, sem qualquer intervenção do CLP.","correct":false,"feedback":"Não há ligação direta entre a rede Ethernet industrial e a rede Fieldbus nesse cenário — os dispositivos de campo não recebem nem retransmitem tráfego da rede Ethernet industrial sem a intermediação do CLP."},{"text":"Os dispositivos de campo enviam seus dados simultaneamente para o SCADA e para o CLP, de forma redundante e independente, pela mesma rede Fieldbus.","correct":false,"feedback":"O enunciado deixa claro que não há ligação direta entre o SCADA e a rede Fieldbus, portanto os dispositivos de campo não conseguem enviar dados diretamente ao SCADA."},{"text":"O SCADA realiza a leitura por meio de um segundo módulo de comunicação sem fio embutido em cada dispositivo de campo, que opera em paralelo à rede Fieldbus.","correct":false,"feedback":"O cenário descrito não menciona nenhum módulo de comunicação sem fio adicional nos dispositivos de campo; a única via de comunicação descrita é a rede Fieldbus, intermediada pelo CLP."}]},{"id":7,"tag":"ENADE 2023 – Engenharia de Controle e Automação","statement":"Para normatizar os requisitos de interoperabilidade, interconectividade, portabilidade e escalabilidade em redes de equipamentos eletrônicos, a International Standard Organization (ISO) procurou criar um modelo de arquitetura aberta padrão, baseada em camadas, sendo definido o Modelo de Referência para Interconexão de Sistemas Abertos (Reference Model for Open Systems Interconnection – RM OSI).<br><br>AGUIRRE, L. A. <em>et al</em>. Enciclopédia de automática: controle e automação, v. 2, 1. ed. São Paulo: Blucher, 2007 (adaptado).<br><br>Considerando os protocolos de comunicação industrial, avalie as afirmações a seguir.","image":null,"items":["A camada física tem como função básica a adaptação do sinal ao meio de transmissão e vice-versa.","A camada de enlace tem o objetivo de prover uma conexão confiável sobre um meio físico, sincronizar e empacotar dados.","A camada de aplicação faz a seleção do modo de diálogo, determina a qualidade de serviço aceitável na conexão, identifica futuros parceiros na comunicação, controla o acesso e integridade de dados."],"items_intro":"É correto o que se afirma em","alts":[{"text":"I, apenas.","correct":false,"feedback":"II e III também são verdadeiras: descrevem corretamente, respectivamente, os papéis clássicos da camada de enlace (conexão confiável, sincronização e empacotamento) e da camada de aplicação (seleção do modo de diálogo, QoS, identificação de parceiros, controle de acesso e integridade) no modelo OSI."},{"text":"III, apenas.","correct":false,"feedback":"I e II também são verdadeiras e descrevem corretamente as funções clássicas das camadas física e de enlace, respectivamente, no modelo de referência OSI."},{"text":"I e II, apenas.","correct":false,"feedback":"III também é verdadeira: a descrição apresentada corresponde às atribuições clássicas da camada de aplicação no modelo OSI."},{"text":"II e III, apenas.","correct":false,"feedback":"I também é verdadeira: a adaptação do sinal ao meio físico de transmissão (e vice-versa) é exatamente a função básica da camada física no modelo OSI."},{"text":"I, II e III.","correct":true,"feedback":"Correto. As três afirmações descrevem corretamente as funções clássicas do modelo de referência OSI: a camada física adapta o sinal ao meio de transmissão; a camada de enlace garante uma conexão confiável, sincronizando e empacotando os dados; e a camada de aplicação seleciona o modo de diálogo, define a QoS aceitável, identifica parceiros de comunicação e controla acesso e integridade dos dados."}]},{"id":8,"tag":"ENADE 2021 – Tecnologia em Redes de Computadores","statement":"Considera-se, no perfil dos profissionais da área de comunicação de dados, a busca de conhecimentos técnicos e transversais para avaliar e implementar tecnologias emergentes em redes de computadores. Nesse sentido, associar redes de sensores sem fio aplicadas à Internet das Coisas (IoT) é uma das questões a serem resolvidas na implementação de tecnologias emergentes em redes.<br><br>Considerando as informações do texto e a importância das tecnologias emergentes, avalie as afirmações a seguir.","image":null,"items":["O padrão IEEE 802.15.4 é utilizado nas redes de sensores sem fio por atender a requisitos de baixa taxa de transmissão de dados e uso eficiente da energia dos dispositivos.","Uma <em>Wireless Sensor Network</em> (WSN), conhecida como Rede de Sensores Sem Fio (RSSF), é composta por dispositivos autônomos e distribuídos que utilizam sensores para monitorar condições físicas e ambientais.","As redes de sensores sem fio fornecem aplicações para IoT, com o uso do padrão IEEE 802.11 sendo utilizado para criar redes que requerem uma baixa taxa de transferência de dados e o uso eficiente de energia."],"items_intro":"É correto o que se afirma em","alts":[{"text":"I, apenas.","correct":false,"feedback":"II também é verdadeira: essa é justamente a definição padrão de uma WSN/RSSF — dispositivos autônomos e distribuídos com sensores para monitoramento físico/ambiental."},{"text":"III, apenas.","correct":false,"feedback":"III é falsa: o padrão associado a baixa taxa de dados e eficiência energética é o IEEE 802.15.4 (base de tecnologias como Zigbee), não o IEEE 802.11 (Wi-Fi, projetado para maior throughput)."},{"text":"I e II, apenas.","correct":true,"feedback":"Correto. I é verdadeira: o IEEE 802.15.4 é o padrão típico de redes de sensores sem fio, com baixa taxa de dados e baixo consumo de energia. II é verdadeira: é a definição correta de WSN/RSSF. III é falsa, pois atribui ao IEEE 802.11 (Wi-Fi) uma característica que é, na verdade, do IEEE 802.15.4."},{"text":"II e III, apenas.","correct":false,"feedback":"III é falsa: o padrão de baixa taxa de dados e uso eficiente de energia para WSN é o IEEE 802.15.4, e não o IEEE 802.11 (padrão Wi-Fi, voltado a maior desempenho)."},{"text":"I, II e III.","correct":false,"feedback":"III é falsa: ela atribui ao IEEE 802.11 uma característica que pertence ao IEEE 802.15.4 (baixa taxa de transmissão e uso eficiente de energia para sensores)."}]},{"id":9,"tag":"Questão inédita – Redes de Comunicação Industrial","statement":"O padrão PROFIBUS (<em>Process Field Bus</em>) é um dos protocolos de comunicação industrial mais difundidos, apresentando variantes distintas conforme a aplicação. Avalie as afirmações a seguir sobre o PROFIBUS.","image":null,"items":["O PROFIBUS DP (<em>Decentralized Periphery</em>) é otimizado para comunicação rápida entre CLPs e dispositivos de E/S descentralizados, sendo amplamente usado em automação de manufatura.","O PROFIBUS PA (<em>Process Automation</em>) é voltado para automação de processos contínuos e permite alimentação elétrica dos instrumentos pelo próprio barramento, sendo adequado para áreas classificadas com risco de explosão, por meio da técnica de segurança intrínseca.","O PROFIBUS DP e o PROFIBUS PA utilizam a mesma camada física, baseada em RS-485, o que permite a interconexão direta entre os dois segmentos sem qualquer dispositivo intermediário.","O acesso ao barramento no PROFIBUS é controlado pelo método de passagem de <em>token</em> entre mestres, combinado com um esquema mestre-escravo entre cada mestre e seus escravos."],"items_intro":"É correto apenas o que se afirma em","alts":[{"text":"I e II.","correct":false,"feedback":"IV também é verdadeira: o PROFIBUS utiliza o método híbrido de passagem de token entre os mestres da rede, combinado com polling mestre-escravo entre cada mestre e seus escravos vinculados."},{"text":"I, II e IV.","correct":true,"feedback":"Correto. I é verdadeira: o DP é otimizado para comunicação rápida com periferia descentralizada em manufatura. II é verdadeira: o PA é voltado a processos contínuos, alimenta instrumentos pelo próprio barramento e suporta segurança intrínseca para áreas classificadas. IV é verdadeira: o PROFIBUS combina passagem de token (entre mestres) com polling mestre-escravo. III é falsa, pois o PA utiliza uma camada física distinta (IEC 61158-2, com sinalização e alimentação diferentes do RS-485), exigindo um acoplador/link DP/PA para interligar os dois segmentos."},{"text":"II e III.","correct":false,"feedback":"III é falsa: DP e PA não compartilham a mesma camada física — o PA usa a camada física IEC 61158-2, distinta do RS-485 usado pelo DP, exigindo um dispositivo acoplador (segment coupler/link) entre os dois segmentos."},{"text":"I, III e IV.","correct":false,"feedback":"III é falsa: a interconexão entre segmentos DP e PA não é direta, pois eles operam em camadas físicas diferentes (RS-485 no DP e IEC 61158-2 no PA), sendo necessário um acoplador ou link dedicado."},{"text":"I, II, III e IV.","correct":false,"feedback":"III é falsa: DP e PA utilizam camadas físicas distintas (RS-485 e IEC 61158-2, respectivamente), o que exige um dispositivo intermediário (acoplador/link) para interconectar os dois segmentos — não é possível a ligação direta."}]},{"id":10,"tag":"Questão inédita – Redes de Comunicação Industrial","statement":"O protocolo HART (<em>Highway Addressable Remote Transducer</em>) é amplamente utilizado na indústria de processos para comunicação com instrumentos de campo inteligentes. A respeito de suas características, assinale a alternativa correta.","image":null,"alts":[{"text":"O HART substitui completamente o sinal analógico 4-20mA, transmitindo apenas dados digitais em um barramento dedicado.","correct":false,"feedback":"O HART não substitui o sinal analógico: ele foi projetado justamente para coexistir com o tradicional laço de corrente 4-20mA, sobrepondo um sinal digital a ele."},{"text":"O HART utiliza modulação FSK (<em>Frequency Shift Keying</em>) para sobrepor um sinal digital de baixa velocidade ao tradicional sinal analógico de 4-20mA, permitindo comunicação simultânea de ambos.","correct":true,"feedback":"Correto. O HART usa modulação FSK (baseada no padrão Bell 202) para transmitir dados digitais sobre o mesmo par de fios do sinal analógico 4-20mA, sem interferir no valor médio da corrente (e, portanto, na variável de processo transmitida de forma analógica)."},{"text":"O HART é um protocolo puramente digital baseado em Ethernet, incompatível com instrumentação analógica legada.","correct":false,"feedback":"O HART não é baseado em Ethernet; é um protocolo híbrido analógico/digital criado justamente para ser compatível com a infraestrutura analógica 4-20mA já instalada."},{"text":"No HART, cada instrumento de campo pode ser endereçado apenas em modo ponto a ponto (<em>point-to-point</em>), sendo impossível a operação em modo multiponto (<em>multidrop</em>).","correct":false,"feedback":"O HART também suporta o modo multiponto (multidrop), no qual vários instrumentos compartilham o mesmo par de fios, endereçados individualmente — nesse modo, a corrente é fixada em um valor constante e a comunicação passa a ser exclusivamente digital."},{"text":"O HART opera exclusivamente na camada física óptica, exigindo cabos de fibra óptica para sua implementação.","correct":false,"feedback":"O HART opera sobre o tradicional par de fios de cobre do laço de corrente 4-20mA, e não sobre fibra óptica."}]},{"id":11,"tag":"Questão inédita – Redes de Comunicação Industrial","statement":"O AS-Interface (AS-i) é um sistema de rede de comunicação industrial destinado ao nível mais baixo da automação (nível de sensores e atuadores binários). Avalie as afirmações a seguir.","image":null,"items":["O AS-i utiliza um cabo único, não blindado e não trançado, para transmitir dados e alimentação elétrica aos dispositivos de campo simultaneamente.","O formato do cabo AS-i (perfil trapezoidal) impede a inversão de polaridade durante a instalação.","Uma rede AS-i pode endereçar dezenas de escravos (até 62, na versão estendida), com tempo de ciclo determinístico.","O AS-i utiliza arbitragem por prioridade baseada em CSMA/CA, sendo, portanto, uma rede com tempo de resposta não determinístico, semelhante ao Ethernet clássico."],"items_intro":"É correto apenas o que se afirma em","alts":[{"text":"I e II.","correct":false,"feedback":"III também é verdadeira: a rede AS-i suporta dezenas de escravos endereçáveis (até 62 na versão estendida com endereçamento A/B) e opera com um ciclo de varredura (polling) determinístico."},{"text":"I, II e III.","correct":true,"feedback":"Correto. I é verdadeira: o cabo AS-i, único e não blindado/trançado, transporta simultaneamente dados e alimentação. II é verdadeira: o perfil trapezoidal do cabo evita erros de polaridade na conexão dos dispositivos. III é verdadeira: a rede endereça dezenas de escravos com um ciclo de varredura (polling) determinístico, tipicamente na ordem de poucos milissegundos. IV é falsa, pois o AS-i utiliza um esquema mestre-escravo por polling cíclico, e não arbitragem CSMA/CA — é justamente esse polling que garante seu determinismo."},{"text":"II e IV.","correct":false,"feedback":"IV é falsa: o AS-i não utiliza CSMA/CA; o acesso ao meio é controlado por um mestre único que consulta (polling) cada escravo de forma cíclica e determinística."},{"text":"I, III e IV.","correct":false,"feedback":"IV é falsa: o método de acesso do AS-i é o polling mestre-escravo determinístico, e não uma arbitragem CSMA/CA de tempo de resposta variável."},{"text":"I, II, III e IV.","correct":false,"feedback":"IV é falsa: o AS-i não usa CSMA/CA — seu mecanismo de acesso ao meio é o polling cíclico determinístico realizado por um único mestre, característica central da tecnologia."}]},{"id":12,"tag":"Questão inédita – Redes de Comunicação Industrial","statement":"O barramento CAN (<em>Controller Area Network</em>), originalmente desenvolvido para a indústria automotiva, também é amplamente empregado em automação industrial, frequentemente por meio do protocolo de camada de aplicação CANopen. Assinale a alternativa correta.","image":null,"alts":[{"text":"O CAN utiliza um mecanismo de arbitragem não destrutiva baseado em prioridade, no qual a mensagem com identificador de menor valor numérico vence o acesso ao barramento sem que ocorra colisão ou necessidade de retransmissão.","correct":true,"feedback":"Correto. O CAN utiliza arbitragem bit a bit não destrutiva (baseada em fio-E/wired-AND): quando dois nós transmitem simultaneamente, o identificador de menor valor numérico (maior prioridade) prevalece, e o nó de menor prioridade recua automaticamente sem que haja perda de dados nem necessidade de retransmissão."},{"text":"O CANopen define a camada física do barramento, especificando os níveis de tensão e a taxa de transmissão, sendo independente do protocolo CAN.","correct":false,"feedback":"É o contrário: o CANopen é um protocolo de camada de aplicação/perfil de comunicação construído sobre o CAN (que já define as camadas física e de enlace) — o CANopen não é independente do CAN, ele depende dele."},{"text":"O CAN não possui mecanismos nativos de detecção de erros, dependendo inteiramente de protocolos de camada superior, como o CANopen, para garantir a integridade dos dados.","correct":false,"feedback":"O CAN possui mecanismos robustos e nativos de detecção de erros na própria camada de enlace, como verificação CRC, bit-stuffing e confirmação (ACK), independentemente de qualquer protocolo de camada superior."},{"text":"Em uma rede CAN, apenas um nó pode atuar como mestre, sendo os demais necessariamente escravos, em uma arquitetura estritamente mestre-escravo.","correct":false,"feedback":"O CAN é uma rede multi-mestre (multi-master): qualquer nó pode iniciar a transmissão de uma mensagem quando o barramento está livre, não havendo um único mestre centralizador por definição do protocolo CAN em si."},{"text":"O CANopen é utilizado exclusivamente em aplicações automotivas, não havendo adoção em automação industrial ou robótica.","correct":false,"feedback":"O CANopen é, na verdade, amplamente adotado em automação industrial, robótica e equipamentos médicos, sendo o CAN automotivo tratado por outros protocolos, como o SAE J1939."}]},{"id":13,"tag":"Questão inédita – Redes de Comunicação Industrial","statement":"O protocolo Modbus é um dos mais utilizados na indústria devido à sua simplicidade e à disponibilidade pública de sua especificação. Sobre as variantes Modbus RTU e Modbus TCP, avalie as afirmações a seguir.","image":null,"items":["O Modbus RTU transmite os dados em formato binário compacto sobre uma interface serial (RS-232 ou RS-485), utilizando CRC (<em>Cyclic Redundancy Check</em>) para verificação de integridade da mensagem.","O Modbus TCP encapsula a unidade de dados de protocolo (PDU) do Modbus dentro de um segmento TCP, utilizando por padrão a porta 502, e dispensa o campo de verificação de erros do RTU por já contar com a confiabilidade do TCP.","Em ambas as variantes, a comunicação segue o modelo mestre-escravo (ou cliente-servidor, na terminologia mais recente), no qual os dispositivos escravos somente respondem quando solicitados pelo mestre.","O endereçamento de dispositivos escravos no Modbus RTU é feito por meio de endereços IP, da mesma forma que no Modbus TCP."],"items_intro":"É correto apenas o que se afirma em","alts":[{"text":"I e II.","correct":false,"feedback":"III também é verdadeira: tanto o Modbus RTU quanto o Modbus TCP seguem o modelo mestre-escravo (cliente-servidor), no qual os escravos/servidores somente respondem a solicitações do mestre/cliente."},{"text":"I, II e III.","correct":true,"feedback":"Correto. I é verdadeira: o RTU usa formato binário compacto sobre serial, com CRC para integridade. II é verdadeira: o TCP encapsula a PDU Modbus sobre TCP, tipicamente na porta 502, dispensando o CRC próprio pois já conta com a verificação do TCP/Ethernet. III é verdadeira: ambas seguem o modelo mestre-escravo/cliente-servidor. IV é falsa, pois o Modbus RTU (serial) endereça os escravos por um identificador numérico simples (endereço de estação, de 1 a 247), e não por endereço IP — o endereçamento IP é próprio do Modbus TCP."},{"text":"II e IV.","correct":false,"feedback":"IV é falsa: o Modbus RTU não utiliza endereços IP — o endereçamento é feito por um simples identificador numérico de escravo (1 a 247) na própria interface serial."},{"text":"I, III e IV.","correct":false,"feedback":"IV é falsa: apenas o Modbus TCP usa endereçamento IP; o Modbus RTU (serial) usa um endereço de estação numérico simples, sem relação com IP."},{"text":"I, II, III e IV.","correct":false,"feedback":"IV é falsa: o endereçamento por IP é exclusivo do Modbus TCP — o Modbus RTU, por rodar sobre uma interface serial, usa apenas um identificador numérico de escravo, não um endereço IP."}]},{"id":14,"tag":"Questão inédita – Redes de Comunicação Industrial","statement":"O PROFINET é o padrão de Ethernet industrial promovido pela PROFIBUS & PROFINET International (PI), disponível em diferentes classes de desempenho conforme os requisitos de tempo real da aplicação. Assinale a alternativa correta.","image":null,"alts":[{"text":"O PROFINET RT (<em>Real-Time</em>) atinge determinismo em nível de microssegundos ao substituir totalmente a pilha Ethernet padrão por hardware dedicado de sincronização em cada nó da rede.","correct":false,"feedback":"Essa característica (determinismo em nível de microssegundos com hardware dedicado de sincronização) descreve o PROFINET IRT, não o RT. O PROFINET RT alcança tempo real por meio de priorização de quadros (tagging), sem exigir hardware de sincronização especial em cada nó."},{"text":"O PROFINET IRT (<em>Isochronous Real-Time</em>) utiliza um esquema de sincronização de <em>clock</em> e reserva de janelas de tempo, com suporte de hardware dedicado nos comutadores/ASICs, para garantir determinismo em nível de microssegundos, adequado a aplicações de controle de movimento (<em>motion control</em>).","correct":true,"feedback":"Correto. O PROFINET IRT combina sincronização precisa de clock entre os dispositivos e reserva de janelas de tempo (time slicing) no ciclo de comunicação, implementada em hardware dedicado (ASICs) nos switches/dispositivos, alcançando o determinismo em microssegundos necessário para motion control com múltiplos eixos sincronizados."},{"text":"O PROFINET RT opera sobre uma pilha TCP/IP completa e prioriza pacotes exclusivamente por meio de mecanismos de QoS do IP, sem qualquer modificação na camada de enlace Ethernet.","correct":false,"feedback":"O PROFINET RT prioriza seus quadros de tempo real por meio de mecanismos na própria camada de enlace (como prioridade de VLAN/802.1Q e um EtherType dedicado), contornando a pilha TCP/IP completa para reduzir latência — não depende apenas de QoS em nível de IP."},{"text":"O PROFINET não é compatível com dispositivos Ethernet padrão (TCP/IP), exigindo infraestrutura de rede totalmente proprietária e incompatível com switches comerciais comuns.","correct":false,"feedback":"O PROFINET utiliza a infraestrutura Ethernet padrão (cabeamento, switches comerciais) e é capaz de conviver com tráfego TCP/IP convencional na mesma rede — ele não exige uma infraestrutura totalmente proprietária."},{"text":"As classes RT e IRT do PROFINET oferecem exatamente o mesmo nível de determinismo, diferenciando-se apenas pelo fabricante do dispositivo de campo.","correct":false,"feedback":"RT e IRT oferecem níveis de determinismo distintos: o IRT, com sincronização de clock e reserva de janelas de tempo em hardware, atinge latências e jitter muito menores (ordem de microssegundos) do que o RT, adequado a aplicações menos críticas em tempo (ordem de milissegundos)."}]},{"id":15,"tag":"Questão inédita – Redes de Comunicação Industrial","statement":"O EtherCAT (<em>Ethernet for Control Automation Technology</em>) é uma tecnologia de Ethernet industrial que se destaca por sua abordagem particular de processamento de quadros. Avalie as afirmações a seguir.","image":null,"items":["No EtherCAT, um único quadro Ethernet percorre todos os nós da rede em topologia lógica de anel (mesmo com cabeamento físico em linha, estrela ou árvore), sendo processado \"<em>on the fly</em>\" por cada escravo à medida que o atravessa.","Cada nó EtherCAT insere ou extrai seus dados diretamente no quadro em trânsito, sem a necessidade de recebê-lo, processá-lo integralmente em software e retransmiti-lo, o que reduz drasticamente a latência.","O EtherCAT requer que cada escravo possua uma pilha de protocolo TCP/IP completa para interpretar e processar o quadro Ethernet recebido.","Por seu determinismo e baixa latência, o EtherCAT é frequentemente utilizado em aplicações de controle de movimento (<em>motion control</em>) com múltiplos eixos sincronizados."],"items_intro":"É correto apenas o que se afirma em","alts":[{"text":"I e II.","correct":false,"feedback":"IV também é verdadeira: exatamente por seu baixo jitter e alta velocidade de ciclo, o EtherCAT é uma das tecnologias de rede mais usadas em motion control com sincronização de múltiplos eixos."},{"text":"I, II e IV.","correct":true,"feedback":"Correto. I é verdadeira: o EtherCAT usa uma topologia lógica de anel, processando o quadro \"on the fly\" em cada escravo. II é verdadeira: cada escravo extrai/insere dados diretamente no quadro em trânsito, usando hardware dedicado, sem processá-lo integralmente em software. IV é verdadeira: seu baixo jitter o torna ideal para motion control multieixo. III é falsa, pois o processamento \"on the fly\" é feito por hardware dedicado (ASIC/FPGA) do escravo, sem necessidade de uma pilha TCP/IP completa em cada nó."},{"text":"II e III.","correct":false,"feedback":"III é falsa: o processamento do quadro EtherCAT em cada escravo é realizado por hardware dedicado (ASIC/FPGA), sem exigir uma pilha TCP/IP completa — é justamente essa característica que permite o processamento \"on the fly\" com latência mínima."},{"text":"I, III e IV.","correct":false,"feedback":"III é falsa: os escravos EtherCAT processam o quadro por hardware dedicado, e não por uma pilha TCP/IP completa, o que é essencial para a baixíssima latência da tecnologia."},{"text":"I, II, III e IV.","correct":false,"feedback":"III é falsa: não é necessária uma pilha TCP/IP completa em cada escravo — o processamento do quadro é feito \"on the fly\" por hardware dedicado (ASIC/FPGA), o que é justamente o diferencial de baixa latência do EtherCAT."}]},{"id":16,"tag":"Questão inédita – Redes de Comunicação Industrial","statement":"Considere as asserções a seguir a respeito do padrão OPC UA (<em>OPC Unified Architecture</em>), amplamente adotado como camada de interoperabilidade entre dispositivos de chão de fábrica e sistemas de nível superior (MES, ERP) no contexto da Indústria 4.0.<br><br><strong>I.</strong> O OPC UA é independente de plataforma e de fabricante, podendo operar sobre diferentes protocolos de transporte, como TCP binário ou <em>Web Services</em> (HTTPS), sendo considerado uma tecnologia habilitadora da Indústria 4.0.<br><br><strong>PORQUE</strong><br><br><strong>II.</strong> O OPC UA define, além do mecanismo de comunicação, um modelo de informação orientado a objetos, que permite representar semanticamente os dados e a estrutura de um equipamento, e não apenas seus valores brutos.<br><br>A respeito dessas asserções, assinale a opção correta.","image":null,"alts":[{"text":"As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.","correct":true,"feedback":"Correto. O OPC UA é, de fato, independente de plataforma/fabricante e suporta múltiplos protocolos de transporte, sendo amplamente considerado um habilitador da Indústria 4.0 (I, verdadeira). E é justamente por definir um modelo de informação orientado a objetos — capaz de descrever semanticamente a estrutura e o significado dos dados de um equipamento, além de seus valores — que o OPC UA vai além de um simples mecanismo de troca de bytes e se consolida como peça-chave da interoperabilidade na Indústria 4.0 (II, verdadeira e justificativa correta da I)."},{"text":"As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.","correct":false,"feedback":"A II é, sim, uma justificativa correta da I: é precisamente a capacidade de modelagem semântica orientada a objetos do OPC UA que sustenta seu papel como tecnologia habilitadora da Indústria 4.0, e não apenas sua independência de transporte."},{"text":"A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","correct":false,"feedback":"A II também é verdadeira: o OPC UA de fato define um modelo de informação orientado a objetos (Address Space), capaz de representar semanticamente dados, métodos e relações de um equipamento, e não apenas seus valores brutos."},{"text":"A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","correct":false,"feedback":"A I também é verdadeira: o OPC UA é reconhecidamente independente de plataforma e fabricante, suportando diferentes protocolos de transporte, sendo amplamente citado como tecnologia habilitadora da Indústria 4.0."},{"text":"As asserções I e II são proposições falsas.","correct":false,"feedback":"Ambas as asserções são, na verdade, verdadeiras: o OPC UA é independente de plataforma/transporte e define um rico modelo de informação orientado a objetos, características amplamente documentadas da especificação."}]},{"id":17,"tag":"Questão inédita – Redes de Comunicação Industrial","statement":"O protocolo MQTT (<em>Message Queuing Telemetry Transport</em>) tornou-se um padrão de fato para comunicação em aplicações de IoT e IIoT (Internet Industrial das Coisas). Assinale a alternativa correta a respeito de suas características.","image":null,"alts":[{"text":"O MQTT segue o modelo cliente-servidor tradicional, no qual cada cliente conhece o endereço de todos os demais clientes com os quais deseja trocar mensagens.","correct":false,"feedback":"No MQTT, os clientes não se conhecem diretamente: toda a comunicação é intermediada por um broker central, que desacopla completamente publicadores de assinantes."},{"text":"O MQTT utiliza o padrão <em>publish/subscribe</em> (publicador/assinante), no qual um <em>broker</em> central intermedeia a distribuição de mensagens organizadas por tópicos, desacoplando publicadores de assinantes.","correct":true,"feedback":"Correto. No modelo publish/subscribe do MQTT, os publicadores enviam mensagens a tópicos específicos para um broker central, que se encarrega de distribuí-las a todos os assinantes daquele tópico — publicadores e assinantes não precisam se conhecer nem estar ativos simultaneamente na mesma janela de tempo."},{"text":"O MQTT foi projetado para redes com alta largura de banda e baixa latência, sendo inadequado para dispositivos com recursos computacionais e energéticos limitados.","correct":false,"feedback":"É o oposto: o MQTT foi projetado justamente para redes com largura de banda restrita e dispositivos com recursos limitados de energia e processamento, características típicas de aplicações de IoT."},{"text":"O nível de qualidade de serviço (QoS) no MQTT é fixo e não pode ser configurado por mensagem, sendo sempre entregue exatamente uma vez (QoS 2).","correct":false,"feedback":"O MQTT oferece três níveis configuráveis de QoS por mensagem: QoS 0 (no máximo uma vez, sem confirmação), QoS 1 (pelo menos uma vez) e QoS 2 (exatamente uma vez) — o nível não é fixo."},{"text":"O MQTT opera obrigatoriamente sobre UDP, dispensando o estabelecimento de conexão prévia entre cliente e <em>broker</em>.","correct":false,"feedback":"O MQTT opera classicamente sobre TCP, exigindo o estabelecimento de uma conexão persistente entre cliente e broker antes da publicação/assinatura de mensagens (existe uma variante, o MQTT-SN, pensada para transporte sem TCP, mas o MQTT tradicional é sobre TCP)."}]},{"id":18,"tag":"Questão inédita – Redes de Comunicação Industrial","statement":"O CoAP (<em>Constrained Application Protocol</em>) e o MQTT são dois protocolos de camada de aplicação frequentemente utilizados em cenários de IoT com dispositivos restritos. Avalie as afirmações a seguir sobre suas diferenças.","image":null,"items":["O CoAP foi projetado seguindo um modelo de interação requisição/resposta, semelhante ao REST sobre HTTP, mas utilizando UDP como protocolo de transporte para reduzir o <em>overhead</em>.","O MQTT, por padrão, é orientado a um modelo de publicação/assinatura (<em>publish/subscribe</em>) baseado em tópicos, e não a requisições diretas entre dispositivos.","O CoAP não pode ser utilizado em conjunto com mecanismos de descoberta e observação de recursos, sendo estritamente limitado a requisições únicas do tipo GET.","Ambos os protocolos foram desenvolvidos visando dispositivos com restrições de energia, memória e processamento, típicos de redes de sensores sem fio."],"items_intro":"É correto apenas o que se afirma em","alts":[{"text":"I e II.","correct":false,"feedback":"IV também é verdadeira: tanto o CoAP quanto o MQTT foram concebidos para operar em cenários de recursos restritos (energia, memória, processamento), típicos de dispositivos IoT e redes de sensores."},{"text":"I, II e IV.","correct":true,"feedback":"Correto. I é verdadeira: o CoAP segue um modelo requisição/resposta similar ao REST, porém sobre UDP, reduzindo overhead. II é verdadeira: o MQTT é orientado a publish/subscribe baseado em tópicos, via broker. IV é verdadeira: ambos visam dispositivos com recursos restritos. III é falsa, pois o CoAP possui o mecanismo \"Observe\", que permite a um cliente observar mudanças em um recurso ao longo do tempo, além de suportar descoberta de recursos (CoRE Link Format) — não é limitado a requisições GET únicas."},{"text":"II e III.","correct":false,"feedback":"III é falsa: o CoAP conta com a extensão \"Observe\" para monitoramento contínuo de recursos e com mecanismos de descoberta de recursos, não estando restrito a requisições únicas."},{"text":"I, III e IV.","correct":false,"feedback":"III é falsa: o CoAP suporta observação de recursos (Observe) e descoberta de recursos, não sendo limitado a requisições GET isoladas."},{"text":"I, II, III e IV.","correct":false,"feedback":"III é falsa: o CoAP oferece o mecanismo Observe para monitoramento contínuo de recursos e suporte a descoberta, contrariando a ideia de que estaria limitado a requisições GET únicas."}]},{"id":19,"tag":"Questão inédita – Redes de Comunicação Industrial","statement":"A tecnologia LoRaWAN (<em>Long Range Wide Area Network</em>) é utilizada em aplicações de IoT que demandam longo alcance de comunicação e baixo consumo de energia. Assinale a alternativa correta.","image":null,"alts":[{"text":"O LoRaWAN utiliza uma topologia em malha (<em>mesh</em>), na qual cada dispositivo final retransmite mensagens de outros dispositivos até alcançar o destino.","correct":false,"feedback":"O LoRaWAN utiliza uma topologia em estrela de estrelas (star-of-stars): os dispositivos finais se comunicam diretamente com um ou mais gateways, sem retransmissão por outros dispositivos finais, como ocorreria em uma topologia mesh."},{"text":"A camada física LoRa (<em>Long Range</em>) baseia-se em uma técnica de modulação de espectro espalhado (<em>chirp spread spectrum</em>), que permite comunicação em longas distâncias com baixo consumo de energia, enquanto o LoRaWAN define o protocolo de camada de rede sobre essa camada física.","correct":true,"feedback":"Correto. A modulação LoRa (chirp spread spectrum, CSS) é a camada física que confere longo alcance e robustez a interferências com baixo consumo de energia; o LoRaWAN, por sua vez, é o protocolo de camada de rede (definido pela LoRa Alliance) que estabelece a arquitetura de comunicação, endereçamento, classes de dispositivo e segurança sobre essa camada física."},{"text":"O LoRaWAN é indicado para aplicações que exigem alta taxa de transferência de dados e baixíssima latência, como streaming de vídeo em tempo real.","correct":false,"feedback":"O LoRaWAN é projetado para baixas taxas de transmissão de dados (tipicamente de centenas de bits/s a poucos dezenas de kbit/s), sendo inadequado para aplicações de alta taxa de dados como streaming de vídeo."},{"text":"Nas redes LoRaWAN, os dispositivos finais (<em>end devices</em>) mantêm conexão permanente e sincronizada com o <em>gateway</em>, de forma semelhante a uma rede celular com <em>handover</em> contínuo.","correct":false,"feedback":"Dispositivos LoRaWAN de classe A (a mais comum, voltada à economia de energia) permanecem a maior parte do tempo inativos, iniciando a comunicação apenas quando necessário (uplink), sem manter conexão permanente nem realizar handover como em redes celulares."},{"text":"O alcance típico das redes LoRaWAN é da ordem de poucos metros, sendo comparável ao alcance de redes <em>Bluetooth</em> de baixa energia (BLE).","correct":false,"feedback":"O alcance típico do LoRaWAN é da ordem de quilômetros (podendo chegar a dezenas de quilômetros em áreas rurais/linha de visada), muito superior ao alcance do BLE, que é tipicamente de poucos metros a dezenas de metros."}]},{"id":20,"tag":"Questão inédita – Redes de Comunicação Industrial","statement":"O Zigbee é um protocolo de comunicação sem fio para redes de baixa potência, construído sobre o padrão IEEE 802.15.4. Avalie as afirmações a seguir.","image":null,"items":["O Zigbee define as camadas de rede e de aplicação sobre a camada física e de enlace especificadas pelo IEEE 802.15.4.","Redes Zigbee podem ser organizadas em topologias estrela, árvore ou malha (<em>mesh</em>), permitindo que dispositivos roteadores retransmitam mensagens para estender a cobertura da rede.","O Zigbee é otimizado para aplicações que exigem alta taxa de transferência de dados, como transmissão de vídeo, sendo essa sua principal aplicação em automação predial.","Assim como outras tecnologias baseadas em IEEE 802.15.4, o Zigbee é projetado para dispositivos com restrições de energia, muitas vezes alimentados por bateria por longos períodos."],"items_intro":"É correto apenas o que se afirma em","alts":[{"text":"I e III.","correct":false,"feedback":"III é falsa: o Zigbee é otimizado para baixa taxa de transmissão de dados (até 250 kbit/s), não sendo adequado para transmissão de vídeo — sua aplicação típica é em automação predial e residencial com sensores e atuadores de baixa taxa de dados."},{"text":"I, II e IV.","correct":true,"feedback":"Correto. I é verdadeira: o Zigbee define as camadas de rede e aplicação sobre a base física/enlace do IEEE 802.15.4. II é verdadeira: suporta topologias estrela, árvore e malha, com roteadores retransmitindo mensagens. IV é verdadeira: é projetado para dispositivos de baixo consumo, com bateria durando meses ou anos. III é falsa, pois o Zigbee é otimizado para baixa taxa de dados, sendo inadequado para aplicações como vídeo."},{"text":"II e III.","correct":false,"feedback":"III é falsa: transmissão de vídeo exige alta taxa de dados, incompatível com a proposta do Zigbee, que prioriza baixo consumo de energia e baixa taxa de transmissão."},{"text":"I, III e IV.","correct":false,"feedback":"III é falsa: o Zigbee não é otimizado para alta taxa de dados como vídeo; sua principal característica é justamente a baixa taxa de transmissão associada ao baixo consumo de energia."},{"text":"I, II, III e IV.","correct":false,"feedback":"III é falsa: a aplicação típica do Zigbee em automação predial envolve sensores e atuadores de baixa taxa de dados (iluminação, temperatura, presença), e não streaming de vídeo, que exigiria taxas muito superiores às oferecidas pelo padrão."}]},{"id":21,"tag":"Questão inédita – Redes de Comunicação Industrial","statement":"O TSN (<em>Time-Sensitive Networking</em>) corresponde a um conjunto de padrões IEEE 802.1 que estendem o Ethernet convencional para suportar comunicação determinística e em tempo real. Assinale a alternativa correta.","image":null,"alts":[{"text":"O TSN substitui completamente o Ethernet padrão por um novo protocolo de camada física incompatível com equipamentos de rede convencionais.","correct":false,"feedback":"O TSN não substitui o Ethernet: é um conjunto de extensões (perfis do IEEE 802.1) que operam sobre a infraestrutura Ethernet padrão, mantendo compatibilidade com switches e cabeamento convencionais."},{"text":"O TSN combina mecanismos como sincronização de tempo (baseada no IEEE 802.1AS, derivado do PTP), escalonamento de tráfego por janelas de tempo (<em>time-aware shaping</em>) e reserva de recursos, permitindo que tráfego de controle em tempo real e tráfego de TI convencional convivam na mesma infraestrutura Ethernet.","correct":true,"feedback":"Correto. O TSN é um conjunto coordenado de padrões (como 802.1AS para sincronização de tempo, 802.1Qbv para escalonamento por janelas de tempo e 802.1Qcc para reserva de recursos) que, juntos, permitem determinismo para tráfego crítico de controle convivendo, na mesma rede física, com tráfego de TI convencional (best-effort)."},{"text":"O TSN é uma tecnologia exclusiva de camada de aplicação, não tendo qualquer relação com os mecanismos de escalonamento da camada de enlace do Ethernet.","correct":false,"feedback":"O TSN atua justamente na camada de enlace (camada 2), estendendo o padrão Ethernet/IEEE 802.1 com mecanismos de sincronização, escalonamento e reserva de banda — não é uma tecnologia de camada de aplicação."},{"text":"Por definição, redes TSN não podem transportar tráfego IP convencional, sendo dedicadas exclusivamente a protocolos de automação industrial.","correct":false,"feedback":"Uma das principais vantagens do TSN é justamente permitir que tráfego IP convencional (TI) e tráfego determinístico de controle industrial convivam na mesma infraestrutura de rede, sem a necessidade de redes fisicamente separadas."},{"text":"O TSN elimina a necessidade de sincronização de relógio entre os dispositivos da rede, pois seu determinismo é obtido unicamente pela largura de banda excedente da rede.","correct":false,"feedback":"Pelo contrário: a sincronização precisa de relógio entre os dispositivos (via IEEE 802.1AS) é um dos pilares fundamentais do TSN, essencial para o escalonamento coordenado de janelas de tempo entre os nós da rede."}]},{"id":22,"tag":"Questão inédita – Redes de Comunicação Industrial","statement":"A respeito da sincronização de tempo em redes industriais, considere as asserções a seguir.<br><br><strong>I.</strong> O protocolo PTP (<em>Precision Time Protocol</em>, IEEE 1588) permite sincronizar os relógios de diferentes dispositivos em uma rede Ethernet com precisão da ordem de submicrossegundos.<br><br><strong>PORQUE</strong><br><br><strong>II.</strong> O PTP utiliza a troca de mensagens de sincronização com marcação de tempo (<em>timestamping</em>) realizada o mais próximo possível da camada física, muitas vezes com suporte de hardware dedicado, o que reduz as incertezas (<em>jitter</em>) introduzidas por pilhas de software e sistemas operacionais.<br><br>A respeito dessas asserções, assinale a opção correta.","image":null,"alts":[{"text":"As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.","correct":true,"feedback":"Correto. O PTP realmente atinge precisão de sincronização da ordem de submicrossegundos em redes Ethernet (I, verdadeira). Essa precisão só é alcançável porque o timestamping das mensagens de sincronização é feito o mais próximo possível da camada física — muitas vezes com suporte de hardware dedicado nas placas de rede e switches —, eliminando as variações (jitter) que seriam introduzidas caso a marcação de tempo dependesse de processamento em software e do sistema operacional (II, verdadeira e explica corretamente por que essa precisão é possível)."},{"text":"As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.","correct":false,"feedback":"A II é, sim, a justificativa correta da I: é exatamente o timestamping próximo à camada física (com suporte de hardware) que viabiliza a precisão de submicrossegundos do PTP."},{"text":"A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","correct":false,"feedback":"A II também é verdadeira: o uso de timestamping em hardware, próximo à camada física, é uma característica real e essencial do PTP para atingir alta precisão de sincronização."},{"text":"A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","correct":false,"feedback":"A I também é verdadeira: o PTP (IEEE 1588) é amplamente reconhecido por atingir precisões de sincronização de relógio da ordem de submicrossegundos, sendo usado, inclusive, como base para os mecanismos de sincronização do TSN (via IEEE 802.1AS)."},{"text":"As asserções I e II são proposições falsas.","correct":false,"feedback":"Ambas as asserções são verdadeiras: o PTP realmente atinge precisão de submicrossegundos, e essa precisão decorre justamente do timestamping realizado próximo à camada física, muitas vezes com suporte de hardware dedicado."}]},{"id":23,"tag":"Questão inédita – Redes de Comunicação Industrial","statement":"A norma IEC 62443 estabelece um conjunto de requisitos e boas práticas para a segurança cibernética de sistemas de automação e controle industrial (IACS – <em>Industrial Automation and Control Systems</em>). Avalie as afirmações a seguir.","image":null,"items":["A IEC 62443 introduz o conceito de segmentação da rede industrial em zonas (<em>zones</em>) e conduítes (<em>conduits</em>), delimitando agrupamentos de ativos com requisitos de segurança semelhantes e os canais de comunicação entre eles.","A norma define níveis de segurança (<em>Security Levels</em>, SL) que variam conforme a capacidade de resistência do sistema a diferentes classes de ameaças, da SL 1 (proteção contra violação casual ou coincidente) até níveis mais altos, associados a atacantes com recursos sofisticados e motivação elevada.","Segundo a IEC 62443, é considerada boa prática conectar diretamente a rede de automação industrial (OT) à rede corporativa de TI, sem qualquer zona desmilitarizada (DMZ) intermediária, para simplificar a troca de dados entre os sistemas SCADA e o ERP.","A IEC 62443 recomenda a aplicação do princípio de defesa em profundidade (<em>defense in depth</em>), combinando controles em múltiplas camadas, em vez de depender de um único mecanismo de proteção."],"items_intro":"É correto apenas o que se afirma em","alts":[{"text":"I e III.","correct":false,"feedback":"III é falsa: a IEC 62443 recomenda justamente o oposto — a interposição de uma zona desmilitarizada (DMZ) entre a rede OT e a rede de TI corporativa, e não a conexão direta entre elas."},{"text":"I, II e IV.","correct":true,"feedback":"Correto. I é verdadeira: o modelo de zonas e conduítes é um dos pilares centrais da IEC 62443. II é verdadeira: a norma define níveis de segurança (SL 1 a SL 4) conforme a sofisticação da ameaça a que o sistema deve resistir. IV é verdadeira: a defesa em profundidade, com múltiplas camadas de controles, é um princípio recomendado pela norma. III é falsa, pois a boa prática recomendada é justamente segmentar a rede OT da rede de TI por meio de uma DMZ, e não conectá-las diretamente."},{"text":"II e III.","correct":false,"feedback":"III é falsa: conectar diretamente as redes OT e de TI corporativa, sem DMZ, contraria as recomendações da IEC 62443, que preconiza a segmentação e o isolamento entre esses ambientes."},{"text":"I, III e IV.","correct":false,"feedback":"III é falsa: a norma recomenda a existência de uma DMZ entre a rede de automação industrial e a rede corporativa, não a
