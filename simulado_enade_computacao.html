<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Simulado ENADE – Computação</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5b6573;--bd:#d9dee5;--ac:#1f5fbf;--ok:#1a7f45;--ko:#b3261e;--okb:#e5f5ec;--kob:#fbe9e7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1d2127;--tx:#e8ebef;--mu:#9aa5b3;--bd:#323944;--ac:#6ea8ff;--ok:#5fd18b;--ko:#ff8a80;--okb:#16301f;--kob:#3a1c19}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1d2127;--tx:#e8ebef;--mu:#9aa5b3;--bd:#323944;--ac:#6ea8ff;--ok:#5fd18b;--ko:#ff8a80;--okb:#16301f;--kob:#3a1c19}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:1.2rem;margin:0 0 4px}.mu{color:var(--mu);font-size:.9rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
select,button{font:inherit;padding:8px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer}
button.p{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-top:10px}
.tag{display:inline-block;font-size:.8rem;color:var(--ac);font-weight:600;margin-bottom:6px}
.lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin-top:10px}
.alt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:8px}
.alt b{min-width:1.4em}.alt.ok{background:var(--okb);border-color:var(--ok)}.alt.ko{background:var(--kob);border-color:var(--ko)}
.alt .j{display:block;font-size:.88rem;color:var(--mu);margin-top:3px}
.vt{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.vt span{border:1px solid var(--bd);border-radius:8px;padding:4px 8px;font-size:.9rem}
.vt button{padding:2px 8px}
.pr{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.pr i{display:block;height:100%;background:var(--ac)}
.home{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;padding:6px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;text-decoration:none;margin-bottom:10px}.home:hover{border-color:var(--ac)}
</style></head><body><main>
<a class="home" href="index.html" title="Voltar para a página inicial">← Início</a>
<h1>Simulado ENADE – Computação</h1>
<div class="mu">Eng. da Computação · Sistemas de Informação · ADS — 40 questões inéditas no formato ENADE (contexto, enunciado, A–D)</div>
<div class="bar"><select id="f"><option value="0">Todos os temas (40)</option><option value="2">2 · Análise e arquitetura de sistemas</option><option value="3">3 · Operações e manutenção de software</option><option value="4">4 · Princípios de sistemas operacionais</option><option value="5">5 · Processo de software</option></select>
<button id="sh">Embaralhar ordem</button><button id="gb">Ver gabarito</button></div>
<div class="pr"><i id="pg"></i></div>
<div class="card" id="q"></div>
<div class="bar"><button id="pv">← Anterior</button><button class="p" id="rv">Revelar resposta</button><button id="nx">Próxima →</button></div>
<div class="card" id="g" hidden></div>
</main>
<script>
const T={2:"Análise e arquitetura de sistemas",3:"Operações e manutenção de software",4:"Princípios de sistemas operacionais",5:"Processo de software"};
const D=[
// Tema 2
[2,"Uma loja virtual, construída como monólito, fica lenta em promoções e só escala com servidores maiores.","Qual decisão arquitetural melhor atende à escalabilidade?","Aumentar a memória do servidor único|Separar em serviços independentes com escala horizontal|Migrar os dados para planilhas|Remover o balanceador de carga",1,"A escala vertical tem teto e mantém ponto único de falha.|Permite replicar apenas o componente sobrecarregado.|Planilhas não suportam concorrência nem transações.|Sem balanceador a carga não é distribuída."],
[2,"A equipe levantou requisitos de desempenho, segurança e disponibilidade do sistema.","Esses requisitos são classificados como:","funcionais de interface|regras de negócio|restrições apenas de projeto|não funcionais (atributos de qualidade)",3,"Funcionais descrevem o que o sistema faz, não como se comporta.|Regras de negócio são políticas da organização.|Restrições limitam soluções; não definem qualidade.|Desempenho, segurança e disponibilidade são atributos de qualidade."],
[2,"Um sistema foi organizado em camadas de apresentação, negócio e dados.","Qual o principal benefício dessa arquitetura?","Separação de responsabilidades, facilitando a manutenção|Dispensa de testes|Desempenho máximo garantido|Dispensa de documentação",0,"Cada camada muda com impacto reduzido nas demais.|Testes continuam necessários.|Camadas podem até adicionar custo de chamadas.|Documentação segue necessária."],
[2,"Um diagrama UML mostra atores e funcionalidades sob o ponto de vista do usuário.","Trata-se do diagrama de:","classes|sequência|casos de uso|implantação",2,"Classes mostram estrutura estática.|Sequência mostra troca de mensagens no tempo.|Casos de uso relacionam atores e funcionalidades.|Implantação mostra nós físicos."],
[2,"Um hospital exige que o sistema continue operando mesmo se um servidor falhar.","Qual técnica contribui diretamente para esse requisito?","Cache local|Compressão de dados|Normalização do banco|Replicação com failover",3,"Cache melhora desempenho, não tolera falhas.|Compressão economiza espaço.|Normalização reduz redundância.|Réplicas assumem a carga quando um nó cai."],
[2,"Os módulos de pedido e estoque se comunicam por uma fila de mensagens.","Qual vantagem esse estilo orientado a eventos oferece?","Acoplamento fraco e comunicação assíncrona|Consistência imediata garantida|Latência nula|Dispensa de contrato de mensagens",0,"Produtor e consumidor evoluem de forma independente.|Em geral resulta em consistência eventual.|Filas introduzem alguma latência.|O formato das mensagens precisa ser acordado."],
[2,"Um sistema embarcado lê sensores de um robô e precisa agir dentro de prazos rígidos.","Qual requisito é essencial?","Interface gráfica rica|Armazenamento em nuvem|Resposta em tempo determinístico (tempo real)|Suporte a vários idiomas",2,"Não é o foco de sensores críticos.|Depende de rede e não garante prazo.|Perder o prazo equivale a falha no sistema.|É requisito secundário."],
[2,"O cliente quer trocar o SGBD sem alterar as regras de negócio.","Qual solução arquitetural favorece isso?","Singleton|Camada de abstração de acesso a dados (Repository)|Observer|Decorator",1,"Singleton limita instâncias, não isola dados.|Isola a regra de negócio do banco usado.|Observer notifica mudanças de estado.|Decorator adiciona comportamento a objetos."],
[2,"O modelo C4 descreve contexto, contêineres, componentes e código.","Qual o objetivo desse modelo?","Comunicar a arquitetura em níveis crescentes de detalhe|Gerar código automaticamente|Substituir o levantamento de requisitos|Medir cobertura de testes",0,"Cada nível atende a um público diferente.|É documentação, não gerador de código.|Não substitui requisitos.|Não mede testes."],
[2,"Uma API pública sofre abuso de requisições feito por poucos clientes.","Qual medida é mais adequada?","Aumentar o timeout|Remover a autenticação|Desativar os logs|Limitar taxa (rate limiting) com autenticação por token",3,"Agrava o consumo de recursos.|Impede identificar os abusadores.|Dificulta a auditoria.|Controla uso por cliente identificado."],
// Tema 3
[3,"Após um erro em produção, a equipe corrige o defeito sem alterar funcionalidades.","Esse tipo de manutenção é:","evolutiva|preventiva|corretiva|adaptativa",2,"Evolutiva acrescenta recursos.|Preventiva age antes de haver falha.|Corrige defeito já ocorrido.|Adaptativa responde a mudanças de ambiente."],
[3,"A atualização do sistema operacional dos clientes exigiu ajustes no software.","Trata-se de manutenção:","adaptativa|corretiva|perfectiva|preventiva",0,"Adequa o software ao novo ambiente.|Não havia defeito a corrigir.|Perfectiva melhora desempenho ou usabilidade.|Preventiva antecipa problemas futuros."],
[3,"Código duplicado e funções longas dificultam mudanças no sistema legado.","Qual prática é mais segura?","Reescrever tudo sem testes|Congelar o código|Apenas adicionar comentários|Refatorar apoiado por testes automatizados",3,"Alto risco de regressões.|Impede evolução.|Comentários não removem a causa.|Testes garantem que o comportamento se mantém."],
[3,"Os deploys manuais causam falhas e demoram horas.","Qual prática reduz o problema?","Mais aprovações manuais|Pipeline de CI/CD automatizado|Deploys apenas anuais|Edição direta em produção",1,"Mantém o erro humano.|Torna a entrega repetível e testada.|Acumula mudanças e aumenta o risco.|Elimina rastreabilidade."],
[3,"A equipe acompanha latência, taxa de erros e saturação de recursos em painéis.","Essa atividade é denominada:","teste unitário|refatoração|monitoramento/observabilidade|prototipação",2,"Testa unidades isoladas antes da produção.|Reorganiza código.|Acompanha o sistema em operação.|Valida ideias iniciais."],
[3,"Uma versão com risco será liberada para poucos usuários, com reversão rápida se falhar.","Qual estratégia se aplica?","Big bang|Canary release com rollback|Deploy sem versionamento|Desligar o sistema",1,"Expõe todos de uma vez.|Limita o impacto e permite voltar.|Impede reverter.|Gera indisponibilidade."],
[3,"O contrato prevê 99,9% de disponibilidade mensal e multa em caso de descumprimento.","Esse acordo é um:","SLA|SRS|diagrama UML|WBS",0,"Acordo de nível de serviço.|SRS é especificação de requisitos.|UML é notação de modelagem.|WBS é estrutura analítica do projeto."],
[3,"Chamados com a mesma causa se repetem a cada semana.","A gestão de problemas busca:","fechar chamados mais rápido|culpar o usuário|aumentar a fila de suporte|identificar e eliminar a causa raiz",3,"Isso é gestão de incidentes.|Não resolve a causa.|Agrava o tempo de resposta.|Evita a recorrência dos incidentes."],
[3,"Antes de alterar um módulo legado, a equipe precisa saber o que mais será afetado.","Qual atividade é indicada?","Teste de carga|Treinamento de usuários|Análise de impacto com rastreabilidade|Backup do banco",2,"Mede desempenho, não dependências.|Não mapeia dependências.|Liga requisitos, código e testes afetados.|Protege dados, não prevê impacto."],
[3,"Um servidor perdeu dados; o backup é semanal, mas o negócio tolera perder no máximo 1 hora.","Qual parâmetro foi violado?","RTO|RPO|MTBF|SLA de suporte",1,"RTO é o tempo para restaurar o serviço.|RPO é a perda máxima de dados aceitável.|MTBF é o tempo médio entre falhas.|Não trata de perda de dados."],
// Tema 4
[4,"Dois processos incrementam o mesmo contador sem sincronização e o total sai incorreto.","Esse problema é chamado de:","condição de corrida|thrashing|fragmentação|inanição apenas",0,"O resultado depende da ordem de execução.|Thrashing é excesso de paginação.|Fragmentação é desperdício de memória.|Não é o caso descrito."],
[4,"Para haver deadlock, além de exclusão mútua, posse e espera e não preempção, é necessária:","Qual é a quarta condição?","prioridade fixa|paginação|espera circular|interrupção",2,"Não é condição de Coffman.|Não é condição de Coffman.|Ciclo de processos esperando uns pelos outros.|Não é condição de Coffman."],
[4,"Em um sistema com memória virtual paginada ocorre uma falta de página.","Isso acontece quando:","o disco está cheio|a página referenciada não está na memória física|o processo termina|a CPU superaquece",1,"Não é a causa.|O SO precisa carregá-la do disco.|Término não gera falta de página.|Nada tem a ver."],
[4,"Um escalonador Round Robin usa quantum extremamente pequeno.","Qual é a consequência?","Elimina trocas de contexto|Torna-se FIFO|Aumenta o throughput|Aumenta o overhead de trocas de contexto",3,"Ocorre o contrário.|FIFO ocorre com quantum muito grande.|Reduz o trabalho útil.|Muito tempo é gasto trocando de processo."],
[4,"Duas threads pertencem ao mesmo processo.","O que elas compartilham?","Espaço de endereçamento e recursos abertos|Pilha e registradores|Nada|Tabelas de páginas distintas",0,"Dados globais e arquivos abertos são comuns.|Cada thread tem pilha e registradores próprios.|Compartilham bastante.|A tabela de páginas é única."],
[4,"Um programa de usuário precisa ler um arquivo do disco.","Como acessa o recurso com segurança?","Acesso direto à porta de E/S|Salto direto ao driver|Instrução privilegiada em modo usuário|Chamada de sistema que transfere ao modo kernel",3,"Proibido em modo usuário.|Quebra a proteção.|Gera exceção.|O kernel valida e executa a operação."],
[4,"No escalonamento SJF não preemptivo, chegam continuamente processos curtos.","Qual risco existe?","Deadlock|Inanição dos processos longos|Fragmentação interna|Aumento do quantum",1,"Não há retenção cíclica de recursos.|Os longos podem nunca ser escolhidos.|Relaciona-se à memória.|Não há quantum em SJF."],
[4,"Um semáforo binário protege a seção crítica de um recurso compartilhado.","O que ele garante?","Paralelismo ilimitado|Execução em ordem alfabética|Exclusão mútua|Fim de qualquer deadlock",2,"Limita o acesso.|Sem relação.|Só um processo por vez na seção.|Pode até causar deadlock."],
[4,"Um sistema de arquivos Unix usa i-nodes.","O que o i-node armazena?","Conteúdo e nome do arquivo|Somente o nome|A senha do usuário|Metadados e ponteiros para blocos, sem o nome",3,"O conteúdo fica nos blocos de dados.|O nome fica no diretório.|Não guarda senhas.|Nome está na entrada de diretório."],
[4,"Um dispositivo de E/S sinaliza o fim de uma operação por interrupção.","O que o SO faz?","Salva o contexto e executa o tratador|Desliga a máquina|Ignora o sinal|Reinicia a memória",0,"Depois retoma o processo interrompido.|Exagero.|Perderia dados do dispositivo.|Sem sentido."],
// Tema 5
[5,"Os requisitos mudam com frequência e o cliente deseja entregas curtas e contínuas.","Qual abordagem é mais adequada?","Cascata puro|Projeto completo antecipado|Documentação extensa antes do código|Métodos ágeis iterativos",3,"Pressupõe requisitos estáveis.|Não absorve mudanças.|Atrasa o valor entregue.|Entregas incrementais com feedback."],
[5,"No Scrum, alguém deve priorizar o backlog para maximizar o valor do produto.","Quem exerce esse papel?","Scrum Master|Product Owner|Desenvolvedores|Gerente funcional",1,"Facilita o processo, não prioriza."," Dono do backlog e do valor do produto.|Constroem o incremento.|Não é papel do Scrum."],
[5,"Um projeto usa o modelo em cascata e o cliente só vê o sistema no final.","Qual é a limitação evidenciada?","Entregas em excesso|Ausência de fases|Feedback tardio do cliente|Falta de requisitos",2,"Ocorre o oposto.|As fases existem.|Erros de entendimento são descobertos tarde.|Os requisitos são definidos no início."],
[5,"Uma equipe adota TDD no desenvolvimento.","Qual é o ciclo básico?","Teste falhando, código mínimo, refatoração|Código, teste, ignorar falhas|Documentar e depois codificar|Implantar e depois testar",0,"Ciclo vermelho-verde-refatorar.|Contraria a prática.|Não descreve TDD.|Inverte a lógica."],
[5,"A empresa adota MPS.BR/CMMI em seus projetos.","Qual o objetivo desses modelos?","Eliminar projetos|Avaliar e melhorar a maturidade dos processos|Escrever código|Certificar hardware",1,"Não é objetivo.|Fornecem referência de melhoria contínua.|Não geram código.|Tratam de processos de software."],
[5,"Uma equipe Kanban tem tarefas paradas e muitos itens em execução ao mesmo tempo.","Qual princípio ajuda?","Iterações obrigatórias de duas semanas|Eliminar métricas|Limitar trabalho em andamento (WIP)|Papéis rígidos",2,"Característica do Scrum.|Kanban usa métricas de fluxo.|Reduz gargalos e melhora o fluxo.|Kanban não impõe papéis."],
[5,"Após testar, a equipe quer saber se o produto atende à necessidade do cliente.","Qual pergunta representa a validação?","Construímos o produto corretamente?|O código segue o padrão?|O teste unitário passa?|Construímos o produto certo?",3,"Essa é a verificação.|Verifica conformidade com padrões.|Verifica a unidade.|Validação confirma que atende o uso pretendido."],
[5,"A equipe quer um critério comum para considerar um item do backlog concluído.","Qual artefato serve a isso?","Definition of Done|Estimativa de custo|Arquitetura de referência|Plano de contratação",0,"Critério compartilhado de conclusão.|Outro objetivo.|Outro objetivo.|Outro objetivo."],
[5,"Vários desenvolvedores alteram os mesmos arquivos e surgem versões conflitantes.","O que o controle de versão permite?","Substituir os testes|Rastrear mudanças, criar ramos e reverter|Compilar mais rápido|Eliminar requisitos",1,"Não substitui testes.|Histórico, ramificação e reversão.|Não é sua função.|Requisitos continuam necessários."],
[5,"A equipe estima histórias com story points e mede quantos conclui por sprint.","Para que se usa essa velocidade?","Avaliar indivíduos|Definir salários|Prever a capacidade das próximas iterações|Substituir o backlog",2,"É métrica da equipe.|Não é o objetivo.|Apoia o planejamento.|Não o substitui."]
];
const Q=D.map(d=>({t:d[0],c:d[1],s:d[2],a:d[3].split("|"),k:d[4],j:d[5].split("|")}));
Q[31].j=["Facilita o processo, não prioriza.","Dono do backlog e do valor do produto.","Constroem o incremento.","Não é papel do Scrum."];
let L=[],i=0,shown=false,votes=[0,0,0,0];const $=id=>document.getElementById(id),AL="ABCD";
function build(){const f=+$("f").value;L=Q.filter(x=>!f||x.t==f);i=0;draw()}
function draw(){shown=false;votes=[0,0,0,0];const x=L[i];$("pg").style.width=((i+1)/L.length*100)+"%";$("rv").textContent="Revelar resposta";
$("q").innerHTML=`<span class="tag">Questão ${i+1}/${L.length} · Tema ${x.t}: ${T[x.t]}</span><div class="lbl">Contexto</div><div>${x.c}</div><div class="lbl">Enunciado</div><div><b>${x.s}</b></div>`+x.a.map((a,n)=>`<div class="alt" id="a${n}"><b>${AL[n]}.</b><div>${a}<span class="j" hidden></span></div></div>`).join("")+`<div class="vt"><span>Votos da turma:</span>`+AL.split("").map((l,n)=>`<span>${l}: <b id="v${n}">0</b> <button onclick="vt(${n},1)">+</button><button onclick="vt(${n},-1)">−</button></span>`).join("")+`</div><div id="rs" class="mu"></div>`}
function vt(n,d){votes[n]=Math.max(0,votes[n]+d);$("v"+n).textContent=votes[n];if(shown)res()}
function res(){const x=L[i],tot=votes.reduce((a,b)=>a+b,0);$("rs").textContent=tot?`Acertos da turma: ${Math.round(votes[x.k]/tot*100)}% (${votes[x.k]} de ${tot})`:""}
function rev(){const x=L[i];shown=true;x.a.forEach((_,n)=>{const e=$("a"+n);e.classList.add(n==x.k?"ok":"ko");const j=e.querySelector(".j");j.hidden=false;j.textContent=(n==x.k?"Correta: ":"Errada: ")+x.j[n]});$("rv").textContent="Gabarito: "+AL[x.k];res()}
$("rv").onclick=()=>shown?0:rev();$("nx").onclick=()=>{i=(i+1)%L.length;draw()};$("pv").onclick=()=>{i=(i-1+L.length)%L.length;draw()};$("f").onchange=build;
$("sh").onclick=()=>{L.sort(()=>Math.random()-.5);i=0;draw()};
$("gb").onclick=()=>{const g=$("g");g.hidden=!g.hidden;g.innerHTML="<b>Gabarito (ordem original)</b><div class='mu'>"+Q.map((x,n)=>`${n+1}-${AL[x.k]}`).join(" · ")+"</div>"};
build();
</script></body></html>
